  // ---------- Đăng ký hoạt động theo tháng ----------
  async function setMonthType(memberId, month, val){
    await mutateMembers(latest => latest.map(x => {
      if (x.id !== memberId) return x;
      const mt = Object.assign({}, x.monthlyType || {});
      if (val) mt[month] = val; else delete mt[month];
      return Object.assign({}, x, { monthlyType: mt });
    }));
    render();
  }
  function registerExplain(){
    const mult = (state.settings && state.settings.casualMultiplier) || 1.5;
    return `<b>Cố định</b>: chia phí đều mọi buổi trong tháng, được giữ chỗ. <b>Vãng lai</b>: chỉ trả phí các buổi bạn tham gia, mức phí gấp ${mult} lần.`;
  }
  function openRegisterSheet(month){
    const me = state.me;
    const cur = (me.monthlyType || {})[month] || '';
    const box = el(`<div><h3>Đăng ký ${monthLabel(month)}</h3>
      <div class="a-sub" style="margin-bottom:14px; line-height:1.5;">${registerExplain()}</div>
      <div class="a-vote">
        <button class="a-btn ${cur === 'fixed' ? '' : 'off'}" data-t="fixed">Cố định</button>
        <button class="a-btn ${cur === 'casual' ? '' : 'off'}" data-t="casual">Vãng lai</button>
      </div></div>`);
    box.querySelectorAll('[data-t]').forEach(b => { b.onclick = async () => { closeSheet(); await setMonthType(me.id, month, b.dataset.t); }; });
    openSheet(box);
  }

  // ---------- Duyệt / từ chối thành viên (dùng chung) ----------
  async function approveMember(m){
    showLoading('Đang duyệt tài khoản...');
    const ok = await mutateMembers(latest => latest.map(x => x.id === m.id ? Object.assign({}, x, { status: 'active' }) : x));
    hideLoading();
    if (ok && m.email) {
      const emailSubject = `[CLB ARON] Tài khoản của bạn đã được phê duyệt`;
      const emailBody = `<h3>Chào ${escapeHtml(m.name)},</h3>
        <p>Chúc mừng! Yêu cầu đăng ký tài khoản của bạn tại CLB Cầu lông ARON đã được Ban quản trị phê duyệt thành công.</p>
        <p>Bây giờ bạn đã có thể đăng nhập vào ứng dụng và bắt đầu tham gia hoạt động cùng CLB.</p>
        <p><strong>Tên đăng nhập của bạn:</strong> ${escapeHtml(m.username)}</p>
        <br/>
        <p>Trân trọng,</p>
        <p><strong>Ban quản trị CLB Cầu lông ARON</strong></p>`;
      sendSystemEmail(m.email, emailSubject, emailBody);
    }
    render();
  }
  async function rejectMember(m){
    if (!confirm(`Từ chối và xoá đăng ký của ${m.name}?`)) return;
    showLoading('Đang từ chối đăng ký...');
    const ok = await mutateMembers(latest => latest.filter(x => x.id !== m.id));
    hideLoading();
    if (ok && m.email) {
      const emailSubject = `[CLB ARON] Yêu cầu đăng ký tài khoản bị từ chối`;
      const emailBody = `<h3>Chào ${escapeHtml(m.name)},</h3>
        <p>Yêu cầu đăng ký tài khoản của bạn tại CLB Cầu lông ARON đã không được Ban quản trị phê duyệt.</p>
        <p>Nếu có bất kỳ thắc mắc nào hoặc muốn đăng ký lại, vui lòng liên hệ trực tiếp với Ban quản trị.</p>
        <br/>
        <p>Trân trọng,</p>
        <p><strong>Ban quản trị CLB Cầu lông ARON</strong></p>`;
      sendSystemEmail(m.email, emailSubject, emailBody);
    }
    render();
  }

  // ---------- HỒ SƠ CỦA TÔI ----------
  function renderProfile(){
    const me = state.me;
    const wrap = el(`<div class="a-profile"></div>`);
    const month = state.viewMonth;
    const locked = isMonthLocked(month);
    const curType = (me.monthlyType || {})[month] || '';
    const canEditReg = canManage() || !locked;
    const priv = canManage();
    const xp = calculateMemberXP(me.id, state.sessions);
    const rk = getXPRank(xp);
    const ri = XP_RANKS.findIndex(r => r.key === rk.key);
    const nx = XP_RANKS[ri + 1];
    const pct = nx ? Math.max(5, Math.min(100, Math.round((xp - rk.min) / (nx.min - rk.min) * 100))) : 100;
    let badges = [];
    try { badges = getMemberBadges(me.id, state.sessions) || []; } catch (e) { badges = []; }

    wrap.appendChild(el(`<div class="a-pagehead"><div><div class="a-h2">Hồ sơ của tôi</div><div class="a-sub">Thông tin, đăng ký tháng và mật khẩu</div></div></div>`));

    // Thẻ danh tính
    const head = el(`<section class="a-card a-prof-head">
      <label class="a-prof-av" title="Đổi ảnh đại diện">${me.avatarUrl ? initialsAvatar(me, 76) : initialsAvatar(me, 76)}
        <span class="a-prof-cam">${icon('camera', 16)}</span><input type="file" accept="image/*" id="pf-avatar" hidden></label>
      <div style="min-width:0; flex:1;">
        <div class="a-h2" style="line-height:1.2;">${escapeHtml(me.name)}</div>
        <div class="a-sub" style="word-break:break-all;">@${escapeHtml(me.username)}${me.nickname ? ' · ' + escapeHtml(me.nickname) : ''}</div>
        <div class="a-chips" style="margin-top:8px;"><span class="a-chip info">${ROLE_LABEL[me.role] || me.role}</span><span class="a-chip">${escapeHtml(me.level || '')}</span><span class="a-chip gold">${rk.emoji} ${rk.label}</span></div>
      </div></section>`);
    wrap.appendChild(head);

    // XP + huy hiệu
    const xpCard = el(`<section class="a-card"><div class="a-kicker">Thành tích</div>
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-top:6px;"><div class="a-money" style="margin:0; font-size:26px;">${xp} <span style="font-size:14px; font-weight:700; color:var(--a-ink-3);">XP</span></div><div class="a-sub">${nx ? 'Còn ' + Math.max(0, nx.min - xp) + ' XP lên ' + nx.emoji + ' ' + nx.label : 'Cấp cao nhất 👑'}</div></div>
      <div class="a-xp-bar a-xp-bar-dark" style="margin-top:10px;"><i style="width:${pct}%"></i></div>
      ${badges.length ? `<div class="a-chips" style="margin-top:12px;">${badges.map(b => `<span class="a-chip" title="${escapeHtml(b.desc || '')}" style="background:${b.bg}; color:${b.color};">${b.emoji || b.em || ''} ${escapeHtml(b.label)}</span>`).join('')}</div>` : ''}
    </section>`);
    wrap.appendChild(xpCard);

    // Đăng ký tháng
    const reg = el(`<section class="a-card"><div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <div class="a-kicker">Đăng ký hoạt động</div>
        <input class="bc-input" type="month" id="pf-month" value="${month}" style="width:150px; min-height:38px; padding:6px 10px;" /></div>
      <div class="a-sub" style="margin:8px 0 12px; line-height:1.5;">${registerExplain()}</div>
      <div class="a-seg" id="pf-seg" style="margin-bottom:8px;">
        <button data-t="" class="${curType === '' ? 'on' : ''}" ${canEditReg ? '' : 'disabled'}>Chưa đăng ký</button>
        <button data-t="fixed" class="${curType === 'fixed' ? 'on' : ''}" ${canEditReg ? '' : 'disabled'}>Cố định</button>
        <button data-t="casual" class="${curType === 'casual' ? 'on' : ''}" ${canEditReg ? '' : 'disabled'}>Vãng lai</button>
      </div>
      <div class="a-chips">${locked ? '<span class="a-chip bad">🔒 Đăng ký tháng này đã chốt</span>' : '<span class="a-chip ok">🔓 Đang mở đăng ký</span>'}</div></section>`);
    wrap.appendChild(reg);

    // Thông tin cá nhân
    const info = el(`<section class="a-card"><div class="a-kicker">Thông tin cá nhân</div>
      <div class="a-form">
        ${priv ? `<label>Họ tên<input class="bc-input" id="pf-name" value="${escapeHtml(me.name)}"></label>` : ''}
        <label>Biệt danh (tối đa 35 ký tự)<input class="bc-input" id="pf-nick" maxlength="35" value="${escapeHtml(me.nickname || '')}"></label>
        <label>Email<input class="bc-input" id="pf-email" type="email" value="${escapeHtml(me.email || '')}"></label>
        <label>Số điện thoại<input class="bc-input" id="pf-phone" value="${escapeHtml(me.phone || '')}"></label>
        <label>Trình độ<select class="bc-select" id="pf-level">${LEVELS.map(l => `<option ${l === me.level ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        ${priv ? `<label>Giới tính<select class="bc-select" id="pf-gender"><option value="Nam" ${me.gender !== 'Nữ' ? 'selected' : ''}>Nam</option><option value="Nữ" ${me.gender === 'Nữ' ? 'selected' : ''}>Nữ</option></select></label>` : ''}
        <button class="a-btn" id="pf-save">Lưu thông tin</button>
        <div id="pf-info-msg" class="a-msg"></div>
      </div></section>`);
    wrap.appendChild(info);

    // Đổi mật khẩu
    const pw = el(`<section class="a-card"><div class="a-kicker">Đổi mật khẩu</div>
      <div class="a-form">
        <label>Mật khẩu hiện tại<input class="bc-input" type="password" id="pf-pw-old" autocomplete="current-password"></label>
        <label>Mật khẩu mới (tối thiểu 4 ký tự)<input class="bc-input" type="password" id="pf-pw-new" autocomplete="new-password"></label>
        <label>Nhập lại mật khẩu mới<input class="bc-input" type="password" id="pf-pw-new2" autocomplete="new-password"></label>
        <button class="a-btn" id="pf-pw-btn">Đổi mật khẩu</button>
        <div id="pf-pw-msg" class="a-msg"></div>
      </div></section>`);
    wrap.appendChild(pw);

    // Giao diện + đăng xuất
    const dark = document.body.classList.contains('dark-theme');
    const foot = el(`<section class="a-card"><div class="a-list">
      <button class="a-row" id="pf-theme">${icon(dark ? 'sun' : 'moon')}<span>Chuyển sang giao diện ${dark ? 'sáng' : 'tối'}</span></button>
      <button class="a-row danger" id="pf-logout">${icon('logout')}<span>Đăng xuất</span></button></div></section>`);
    wrap.appendChild(foot);

    // ----- xử lý -----
    const q = (id) => wrap.querySelector(id);
    q('#pf-avatar').onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      compressImage(f, 120, 0.7, async (url) => {
        await mutateMembers(latest => latest.map(x => x.id === me.id ? Object.assign({}, x, { avatarUrl: url }) : x));
        render();
      });
    };
    q('#pf-month').onchange = (e) => { state.viewMonth = e.target.value || monthKey(); render(); };
    wrap.querySelectorAll('#pf-seg button').forEach(b => { b.onclick = () => { if (!canEditReg) return; setMonthType(me.id, month, b.dataset.t); }; });
    q('#pf-theme').onclick = toggleTheme;
    q('#pf-logout').onclick = doLogout;

    q('#pf-save').onclick = async () => {
      const msg = q('#pf-info-msg');
      const say = (t, ok) => { msg.style.color = ok ? 'var(--a-ok)' : 'var(--a-bad)'; msg.textContent = t; };
      const newName = priv ? q('#pf-name').value.trim() : me.name;
      const newNick = (q('#pf-nick').value || '').trim().slice(0, 35);
      const newEmail = normEmail(q('#pf-email').value);
      const newPhone = q('#pf-phone').value.trim();
      const newLevel = q('#pf-level').value;
      const newGender = priv ? q('#pf-gender').value : (me.gender || 'Nam');
      if (!newName || !newEmail) { say('Họ tên và email không được bỏ trống.', false); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) { say('Địa chỉ email không đúng định dạng.', false); return; }
      let err = '';
      const ok = await mutateMembers(latest => {
        if (latest.some(x => x.id !== me.id && normEmail(x.email) === newEmail)) { err = 'Email này đã được sử dụng bởi thành viên khác.'; return null; }
        return latest.map(x => x.id === me.id ? Object.assign({}, x, { name: newName, nickname: newNick, email: newEmail, phone: newPhone, level: newLevel, gender: newGender }) : x);
      });
      if (!ok) { say(err || state.lastSaveErrorMsg || 'Lưu thất bại, thử lại.', false); return; }
      render();
      showToast('Đã lưu thông tin', 'success');
    };

    q('#pf-pw-btn').onclick = async () => {
      const msg = q('#pf-pw-msg');
      const say = (t, ok) => { msg.style.color = ok ? 'var(--a-ok)' : 'var(--a-bad)'; msg.textContent = t; };
      const oldPw = q('#pf-pw-old').value, newPw = q('#pf-pw-new').value, newPw2 = q('#pf-pw-new2').value;
      if (!oldPw || !newPw) { say('Nhập đủ thông tin.', false); return; }
      if (newPw.length < 4) { say('Mật khẩu mới cần ít nhất 4 ký tự.', false); return; }
      if (newPw !== newPw2) { say('Mật khẩu mới không khớp.', false); return; }
      const oldPwHash = await hashPassword(oldPw, me.username);
      const newPwHash = await hashPassword(newPw, me.username);
      const { data: oldOk } = await sb.rpc('bc_verify_login', { p_username: me.username, p_password_hash: oldPwHash });
      if (!oldOk) { say('Sai mật khẩu hiện tại.', false); return; }
      const ok = await mutateMembers(latest => latest.map(x => x.id === me.id ? Object.assign({}, x, { password: newPwHash }) : x));
      if (!ok) { say(state.lastSaveErrorMsg || 'Đổi mật khẩu thất bại.', false); return; }
      state.myPasswordHash = newPwHash;
      if (state.rememberData && normUsername(state.rememberData.username) === normUsername(me.username)) {
        state.rememberData = { username: me.username, password: newPwHash }; saveRemember(state.rememberData);
      }
      q('#pf-pw-old').value = ''; q('#pf-pw-new').value = ''; q('#pf-pw-new2').value = '';
      say('Đã đổi mật khẩu thành công.', true);
    };
    return wrap;
  }

  // ---------- THÀNH VIÊN (Admin / R1): danh sách gọn + sheet thao tác ----------
  function membersHead(){
    const head = el(`<div class="a-pagehead"><div><div class="a-h2">Thành viên</div><div class="a-sub">Duyệt, phân quyền và đăng ký tháng</div></div>
      <button class="a-btn sm" id="a-addmem">${icon('plus', 18)}Thêm</button></div>`);
    head.querySelector('#a-addmem').onclick = () => { state.showAddMember = !state.showAddMember; render(); };
    return head;
  }
  function renderMemberListRow(m){
    const cur = (m.monthlyType || {})[state.viewMonth] || '';
    const isSelf = state.me && state.me.id === m.id;
    const statusChip = m.status === 'pending' ? '<span class="a-chip warn">Chờ duyệt</span>' : (m.status === 'inactive' ? '<span class="a-chip bad">Ngưng hoạt động</span>' : '');
    const roleChip = m.role !== 'r2' ? `<span class="a-chip info">${ROLE_LABEL[m.role] || m.role}</span>` : '';
    const typeChip = m.status === 'pending' ? '' : (cur === 'fixed' ? '<span class="a-chip ok">Cố định</span>' : (cur === 'casual' ? '<span class="a-chip gold">Vãng lai</span>' : '<span class="a-chip">Chưa đăng ký</span>'));
    const main = (m.nickname || m.name || '').trim();
    const sub = (m.nickname && m.name ? escapeHtml(m.name) + ' · ' : '') + '@' + escapeHtml(m.username || '');
    const row = el(`<div class="a-mrow" data-id="${m.id}">
      <div class="a-mrow-main"><div class="a-mav">${avatarHtml(m, 44)}</div>
        <div class="a-mi"><div class="a-mn">${escapeHtml(main)}${isSelf ? ' <span class="a-chip gold" style="height:20px;padding:0 7px;font-size:10.5px;">Bạn</span>' : ''}</div><div class="a-ms">${sub}</div>
          <div class="a-chips" style="margin-top:6px;">${statusChip}${roleChip}${typeChip}</div></div>
        <span class="a-chev">${icon('chev', 20)}</span></div>
    </div>`);
    if (m.status === 'pending') {
      const acts = el(`<div class="a-mrow-act"><button class="a-btn sm ok" data-a="ok">${icon('check', 18)}Chấp nhận</button><button class="a-btn sm ghost" data-a="no">Từ chối</button></div>`);
      acts.querySelector('[data-a="ok"]').onclick = (e) => { e.stopPropagation(); approveMember(m); };
      acts.querySelector('[data-a="no"]').onclick = (e) => { e.stopPropagation(); rejectMember(m); };
      row.appendChild(acts);
    }
    row.querySelector('.a-mrow-main').onclick = () => showMemberSheet(m);
    return row;
  }
  function showMemberSheet(m, instant){
    const box = el(`<div class="a-msheet"></div>`);
    box.appendChild(renderMemberRow(m));
    openSheet(box, instant);
    state.memberSheetId = m.id;
  }
  function restoreMemberSheet(){
    if (!state.memberSheetId) return;
    const mm = state.members.find(x => x.id === state.memberSheetId);
    if (mm && state.tab === 'members' && canManage()) showMemberSheet(mm, true);
    else closeSheet();
  }

  // ---------- QUỸ: gập các mục phụ ----------
  function foldFundSections(wrap){
    state.fundFold = state.fundFold || {};
    const heads = Array.from(wrap.children).filter(c => c.dataset && c.dataset.fold);
    heads.forEach((h, i) => {
      const key = h.dataset.fold;
      const open = !!state.fundFold[key];
      const stop = heads[i + 1] || null;
      const body = el(`<div class="a-fold-body" style="${open ? '' : 'display:none;'}"></div>`);
      let n = h.nextSibling;
      while (n && n !== stop) { const nx = n.nextSibling; body.appendChild(n); n = nx; }
      wrap.insertBefore(body, stop);
      h.classList.toggle('open', open);
      h.onclick = () => {
        state.fundFold[key] = !state.fundFold[key];
        body.style.display = state.fundFold[key] ? '' : 'none';
        h.classList.toggle('open', !!state.fundFold[key]);
      };
    });
  }


  // =====================================================================
  //  ARON UI · đợt 3 — gập các mục phụ (Quản lý, Xếp hạng)
  // =====================================================================
  function foldCards(wrap, startIdx, keyPrefix, titleOf){
    state.mgrFold = state.mgrFold || {};
    Array.from(wrap.children).slice(startIdx).forEach((card, i) => {
      if (!card.classList || !card.classList.contains('bc-card')) return;
      const heading = card.querySelector('h3, h2, h4');
      const raw = card.textContent || '';
      const title = titleOf(raw) || (heading ? heading.textContent.trim() : 'Mục ' + (i + 1));
      if (heading) heading.style.display = 'none';
      const key = keyPrefix + ':' + title;
      const open = !!state.mgrFold[key];
      const btn = el(`<button class="a-fold-h ${open ? 'open' : ''}">${escapeHtml(title)}</button>`);
      card.style.display = open ? '' : 'none';
      card.classList.add('a-fold-card');
      btn.onclick = () => {
        state.mgrFold[key] = !state.mgrFold[key];
        card.style.display = state.mgrFold[key] ? '' : 'none';
        btn.classList.toggle('open', !!state.mgrFold[key]);
      };
      wrap.insertBefore(btn, card);
    });
  }
  function mgrTitleOf(t){
    if (t.includes('Cấu hình tài khoản nhận tiền')) return 'Tài khoản nhận tiền (VietQR / MoMo)';
    if (t.includes('vãng lai trả gấp')) return 'Phí vãng lai (hệ số)';
    if (t.includes('Logo & banner')) return 'Logo & banner màn đăng nhập';
    if (t.includes('Auto-Rules')) return 'Tự động hoá (nhắc vote, nhắc nợ…)';
    if (t.includes('Mùa giải mới')) return 'Mùa giải mới (Reset XP)';
    if (t.includes('Mail Server') || t.includes('Email hệ thống')) return 'Email hệ thống';
    return '';
  }
  function foldRoast(card){
    card.classList.add('a-roast');
    if (!state.roastOpen) card.classList.add('closed');
    const head = card.firstElementChild;
    if (head) {
      head.style.cursor = 'pointer';
      head.addEventListener('click', () => {
        state.roastOpen = !state.roastOpen;
        card.classList.toggle('closed', !state.roastOpen);
      });
    }
  }


  // =====================================================================

  // ---- Gợn sóng khi bấm nút + pháo giấy khi bấm "Tham gia" (nhẹ, chỉ chạy khi có tương tác) ----
  (function(){
    if (window.__aFx) return; window.__aFx = true;
    const calm = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.addEventListener('pointerdown', function(e){
      if (calm()) return;
      const b = e.target.closest && e.target.closest('.a-btn');
      if (!b || b.disabled) return;
      const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;
      const s = document.createElement('span'); s.className = 'a-ripple';
      s.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
      b.appendChild(s); setTimeout(() => s.remove(), 650);
    }, true);
    document.addEventListener('click', function(e){
      if (calm()) return;
      const b = e.target.closest && e.target.closest('.a-btn[data-v="yes"]');
      if (!b || b.classList.contains('ok')) return; // chỉ khi chuyển sang "Tham gia"
      const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const colors = ['#FF831C', '#F1B13F', '#FC7D60', '#0B5E75', '#96CAFF', '#fff'];
      for (let i = 0; i < 22; i++) {
        const c = document.createElement('i'); c.className = 'a-confetti';
        const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 90;
        c.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;background:' + colors[i % colors.length] +
          ';--dx:' + Math.cos(ang) * dist + 'px;--dy:' + (Math.sin(ang) * dist - 40) + 'px;--rot:' + (Math.random() * 720 - 360) + 'deg';
        document.body.appendChild(c); setTimeout(() => c.remove(), 950);
      }
    }, true);
  })();

  document.documentElement.style.setProperty('--a-banner', 'url("' + A_BANNER_URL + '")');

  function render(){
    const appEl = document.getElementById('app');
    if (appEl) {
      if (state.me && state.tab === 'report') {
        appEl.style.maxWidth = '1000px';
      } else {
        appEl.style.maxWidth = '720px';
      }
    }
    const root = document.getElementById('root');
    root.innerHTML = '';
    root.className = ((state.me && !state.quickVoteMode) ? 'a-authed' : '') + (window.__aEnter ? ' a-enter' : '');
    
    if (state.me && state.quickVoteMode) {
      root.appendChild(renderQuickVoteScreen());
      return;
    }
    
    if (!state.me) {
      root.appendChild(renderAuth());
      return;
    }
    root.appendChild(renderHeader());
    if (state.saveError) {
      const errBanner = el(`<div class="bc-card" style="background:#FAECE7; border-color:#E3A693; color:#993C1D; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <span>⚠ ${escapeHtml(state.saveError)}</span>
        <button class="bc-btn danger small" id="bc-dismiss-err">Đóng</button>
      </div>`);
      root.appendChild(errBanner);
      setTimeout(() => { const b = document.getElementById('bc-dismiss-err'); if (b) b.onclick = () => { state.saveError = null; render(); }; }, 0);
    }
    if (state.tab === 'members' && !canManage()) state.tab = 'profile';
    const KNOWN_TABS = ['home', 'sessions', 'leaderboard', 'members', 'fund', 'payments_mgr', 'report', 'profile'];
    if (!KNOWN_TABS.includes(state.tab) || (state.tab === 'payments_mgr' && !canManage())) state.tab = 'home';
    if (state.tab === 'home') root.appendChild(renderHome());
    if (state.tab === 'profile') root.appendChild(renderProfile());
    if (state.tab === 'sessions') root.appendChild(renderSessions());
    if (state.tab === 'leaderboard') root.appendChild(renderLeaderboard());
    if (state.tab === 'members') root.appendChild(renderMembers());
    if (state.tab === 'fund') root.appendChild(renderFund());
    if (state.tab === 'payments_mgr') root.appendChild(renderPaymentsMgr());
    if (state.tab === 'report') root.appendChild(renderReport());
    root.appendChild(renderTabs());
    restoreMemberSheet();
  }

  function renderQuickVoteScreen() {
    const qv = state.quickVoteMode;
    const sess = state.sessions.find(s => s.id === qv.sessionId);
    const member = state.members.find(m => m.username.toLowerCase() === qv.username.toLowerCase());
    
    const wrap = el(`<div style="display:flex; flex-direction:column; align-items:center; width:100%; padding:20px 0;"></div>`);
    
    if (!sess || !member) {
      wrap.appendChild(el(`<div class="bc-card" style="text-align:center; padding:30px;">
        <h3 style="color:#993C1D;">⚠ Lỗi dữ liệu</h3>
        <p style="color:#6b7a73; font-size:14px; margin-bottom:20px;">Không tìm thấy thông tin buổi tập hoặc thành viên tương ứng.</p>
        <button class="bc-btn" id="qv-goto-main">Vào ứng dụng chính</button>
      </div>`));
      setTimeout(() => {
        document.getElementById('qv-goto-main').onclick = () => {
          state.quickVoteMode = null;
          render();
        };
      }, 0);
      return wrap;
    }

    const court = state.courts.find(c => c.id === sess.courtId);
    const courtName = court ? court.name : 'Chưa chọn sân';
    const courtAddress = court && court.address ? court.address : '';
    const mapLink = court && court.mapLink ? court.mapLink : '';
    
    const mKey = sessionMonthKey(sess);
    const myType = (member.monthlyType || {})[mKey] || '';
    const myVote = sess.votes[member.name];
    
    let statusText = 'Bạn chưa biểu quyết';
    let statusColor = '#888780';
    let statusBg = '#F1EFE8';
    
    const isReceiver = Object.values(sess.passes || {}).includes(member.id);
    const hasPassed = myType === 'fixed' && sess.passes && sess.passes[member.id];
    
    if (hasPassed) {
      statusText = 'Bạn đã nhường slot (tính vắng)';
      statusColor = '#854F0B';
      statusBg = '#FAEEDA';
    } else if (isReceiver) {
      statusText = 'Bạn tham gia (Nhận pass)';
      statusColor = '#0C447C';
      statusBg = '#E6F1FB';
    } else if (myVote === 'yes') {
      statusText = 'Bạn đã chọn: THAM GIA 🏸';
      statusColor = '#27500A';
      statusBg = '#EAF3DE';
    } else if (myVote === 'no') {
      statusText = 'Bạn đã chọn: BÁO VẮNG ❌';
      statusColor = '#993C1D';
      statusBg = '#FAECE7';
    }

    let isCasualFull = false;
    if (myType === 'casual' && myVote !== 'yes') {
      let casualPlaying = 0;
      state.members.forEach(x => {
        const t = (x.monthlyType || {})[mKey] || '';
        const v = sess.votes[x.name];
        if (x.status === 'active' && t === 'casual' && v === 'yes') {
          casualPlaying++;
        }
      });
      if (sess.maxCasual && casualPlaying >= sess.maxCasual) {
        isCasualFull = true;
      }
    }

    const card = el(`<div class="bc-card" style="width:100%; max-width:480px; box-shadow:0 12px 40px rgba(0,0,0,0.15); border-radius:16px; background:#FFF; border: 1px solid var(--card-border); padding:24px; text-align:center;">
      <div style="font-size:36px; margin-bottom:10px;">🏸</div>
      <h2 style="font-size:20px; font-weight:700; color:#1B4332; margin-top:0; margin-bottom:6px; font-family:'Oswald', sans-serif; letter-spacing:0.5px;">
        BIỂU QUYẾT NHANH BUỔI TẬP
      </h2>
      <div style="font-size:13px; color:#6b7a73; margin-bottom:20px;">Chào <strong>${escapeHtml(memberDisplayName(member))}</strong> (${myType === 'fixed' ? 'Cố định' : 'Vãng lai'})</div>
      
      <div style="background:#FAF8F5; border:1px solid #E3E0D6; border-radius:10px; padding:12px; margin-bottom:20px; text-align:left; font-size:14px;">
        <div style="font-weight:600; color:#1B4332; margin-bottom:4px;">📅 Lịch tập:</div>
        <div style="color:#2D6A4F; font-weight:500;">${weekdayLabel(sess.date)}, ngày ${formatDate(sess.date)}</div>
        <div style="color:#6b7a73; margin-top:2px;">⏰ Giờ: ${formatTimeRange(sess.time, sess.timeEnd)}</div>
        <div style="color:#6b7a73; margin-top:2px;">📍 Sân: ${escapeHtml(courtName)}</div>
        ${courtAddress ? `<div style="color:#8a877d; font-size:12px; margin-top:2px;">${escapeHtml(courtAddress)}</div>` : ''}
        ${mapLink ? `<div style="margin-top:6px;"><a href="${escapeHtml(mapLink)}" target="_blank" style="color:#0C447C; font-weight:600; text-decoration:none; font-size:12px; display:inline-flex; align-items:center; gap:4px;">📍 Xem bản đồ Google Maps →</a></div>` : ''}
      </div>

      <div style="margin-bottom:25px; padding:10px; border-radius:8px; font-weight:600; font-size:14px; background:${statusBg}; color:${statusColor}; border:1px solid rgba(0,0,0,0.05);">
        ${statusText}
      </div>

      ${sess.locked ? `<div style="color:#993C1D; font-weight:600; font-size:13px; margin-bottom:20px;">🔒 Buổi tập này đã chốt danh sách, không thể thay đổi vote!</div>` : `
        <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:25px;">
          <button class="bc-btn" id="qv-yes-btn" style="background:linear-gradient(135deg, #2D6A4F 0%, #1B4332 100%); color:#FFF; font-size:15px; padding:12px; font-weight:600; border-radius:10px; box-shadow:0 4px 15px rgba(45,106,79,0.25); display:flex; align-items:center; justify-content:center; gap:8px;" ${isCasualFull ? 'disabled' : ''}>
            🏸 ĐI CHƠI NGAY ${isCasualFull ? '(Hết chỗ)' : ''}
          </button>
          <button class="bc-btn outline" id="qv-no-btn" style="border-color:#993C1D; color:#993C1D; font-size:15px; padding:12px; font-weight:600; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:8px;">
            ❌ BÁO VẮNG
          </button>
          ${myType === 'fixed' ? `
            <button class="bc-btn outline" id="qv-pass-btn" style="border-color:#854F0B; color:#854F0B; font-size:15px; padding:12px; font-weight:600; border-radius:10px; display:flex; align-items:center; justify-content:center; gap:8px;">
              🔄 NHƯỜNG SLOT (PASS)
            </button>
          ` : ''}
        </div>
      `}

      <div style="border-top:1px dashed #E3E0D6; padding-top:15px;">
        <button class="bc-btn outline small" id="qv-main-btn" style="border-color:#8a877d; color:#8a877d; font-size:12px; padding:6px 16px;">
          🏠 Vào trang chủ ứng dụng
        </button>
      </div>
    </div>`);

    wrap.appendChild(card);

    setTimeout(() => {
      const btnYes = card.querySelector('#qv-yes-btn');
      const btnNo = card.querySelector('#qv-no-btn');
      const btnPass = card.querySelector('#qv-pass-btn');
      const btnMain = card.querySelector('#qv-main-btn');

      if (btnYes) btnYes.onclick = async () => {
        showLoading('Đang xử lý...');
        const ok = await mutateSessions(latest => {
          const list = Array.isArray(latest) ? latest : [];
          return list.map(s => {
            if (s.id === sess.id) {
              const updatedSess = Object.assign({}, s);
              updatedSess.votes = Object.assign({}, s.votes || {});
              updatedSess.passes = Object.assign({}, s.passes || {});
              updatedSess.votes[member.name] = 'yes';
              delete updatedSess.passes[member.id];
              return updatedSess;
            }
            return s;
          });
        });
        hideLoading();
        if (ok) {
          showToast('Đã ghi nhận biểu quyết tham gia của bạn! 🏸', 'success');
          render();
        } else {
          showToast('Có lỗi xảy ra, vui lòng thử lại.', 'error');
        }
      };

      if (btnNo) btnNo.onclick = async () => {
        showLoading('Đang xử lý...');
        const ok = await mutateSessions(latest => {
          const list = Array.isArray(latest) ? latest : [];
          return list.map(s => {
            if (s.id === sess.id) {
              const updatedSess = Object.assign({}, s);
              updatedSess.votes = Object.assign({}, s.votes || {});
              updatedSess.passes = Object.assign({}, s.passes || {});
              updatedSess.votes[member.name] = 'no';
              delete updatedSess.passes[member.id];
              return updatedSess;
            }
            return s;
          });
        });
        hideLoading();
        if (ok) {
          showToast('Đã ghi nhận biểu quyết vắng của bạn! ❌', 'success');
          render();
        } else {
          showToast('Có lỗi xảy ra, vui lòng thử lại.', 'error');
        }
      };

      if (btnPass) btnPass.onclick = async () => {
        showLoading('Đang xử lý...');
        const ok = await mutateSessions(latest => {
          const list = Array.isArray(latest) ? latest : [];
          return list.map(s => {
            if (s.id === sess.id) {
              const updatedSess = Object.assign({}, s);
              updatedSess.votes = Object.assign({}, s.votes || {});
              updatedSess.passes = Object.assign({}, s.passes || {});
              updatedSess.votes[member.name] = 'no';
              updatedSess.passes[member.id] = 'pending';
              return updatedSess;
            }
            return s;
          });
        });
        hideLoading();
        if (ok) {
          showToast('Đã ghi nhận nhường slot của bạn! 🔄', 'success');
          render();
        } else {
          showToast('Có lỗi xảy ra, vui lòng thử lại.', 'error');
        }
      };

      if (btnMain) btnMain.onclick = () => {
        state.quickVoteMode = null;
        render();
      };
    }, 0);

    return wrap;
  }

  function showForgotPasswordDialog() {
    let dialog = document.getElementById('forgot-pw-dialog');
    const mailConfig = (state.settings && state.settings.mailServer) || {};
    const isEmailEnabled = mailConfig.enabled && (mailConfig.username || mailConfig.googleScriptUrl);

    if (!dialog) {
      dialog = el(`<dialog id="forgot-pw-dialog" style="border:none; border-radius:12px; padding:0; max-width:420px; width:90%; box-shadow:0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); background:#FAF8F5;">
        <div style="padding:1.5rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h3 style="font-size:16px; font-weight:600; color:#1B4332; margin:0;">Khôi phục mật khẩu</h3>
            <button id="forgot-pw-close" style="background:none; border:none; font-size:20px; color:#8a877d; cursor:pointer; line-height:1;">&times;</button>
          </div>
          
          <div id="forgot-pw-email-flow" style="display:${isEmailEnabled ? 'block' : 'none'};">

              Nhập email hoặc tên đăng nhập của bạn. Hệ thống sẽ tạo một mật khẩu tạm thời mới và gửi về email đã đăng ký của bạn.

    if (switchContact) {
      switchContact.onclick = (e) => {
        e.preventDefault();
        document.getElementById('forgot-pw-email-flow').style.display = 'none';
        document.getElementById('forgot-pw-contact-flow').style.display = 'block';
      };
    }

    const switchEmail = document.getElementById('forgot-pw-switch-email');
    if (switchEmail) {
      switchEmail.onclick = (e) => {
        e.preventDefault();
        document.getElementById('forgot-pw-email-flow').style.display = 'block';
        document.getElementById('forgot-pw-contact-flow').style.display = 'none';
      };
    }

    const adminsContainer = document.getElementById('forgot-pw-admins');
    adminsContainer.innerHTML = '';
    const contactable = state.members.filter(m => (m.role === 'admin' || m.role === 'r1') && m.status === 'active');
    if (contactable.length === 0) {
      adminsContainer.appendChild(el(`<div style="font-size:13px; color:#993C1D; text-align:center; padding:10px;">Chưa có Admin nào hoạt động trong CLB.</div>`));
    } else {
      contactable.forEach(adm => {
        const phoneText = adm.phone ? adm.phone : 'Chưa cập nhật SĐT';
        const cleanPhone = adm.phone ? adm.phone.replace(/[^0-9]/g, '') : '';
        const callLink = cleanPhone ? `<a href="tel:${cleanPhone}" class="bc-btn small" style="padding:4px 8px; font-size:11px; display:inline-flex; align-items:center; gap:3px; background:#27500A; border-color:#27500A; color:#FFF; font-weight:500; text-decoration:none;">📞 Gọi</a>` : '';
        const zaloLink = cleanPhone ? `<a href="https://zalo.me/${cleanPhone}" target="_blank" class="bc-btn outline small" style="padding:4px 8px; font-size:11px; color:#0A54A6; border-color:#0A54A6; display:inline-flex; align-items:center; gap:3px; text-decoration:none;">💬 Zalo</a>` : '';
        
        adminsContainer.appendChild(el(`<div class="bc-card" style="padding:10px; margin:0; border:1px solid #E3E0D6; display:flex; justify-content:space-between; align-items:center; background:#fff;">
          <div>
            <div style="font-weight:500; font-size:13px; color:#1B4332;">${escapeHtml(adm.name)}</div>
            <div style="font-size:12px; color:#8a877d; margin-top:2px;">SĐT: ${escapeHtml(phoneText)}</div>
          </div>
          <div style="display:flex; gap:4px;">
            ${callLink}
            ${zaloLink}
          </div>
        </div>`));
      });
    }

    const submitBtn = document.getElementById('forgot-pw-submit-btn');
    if (submitBtn) {
      submitBtn.onclick = async () => {
        const inputVal = document.getElementById('forgot-pw-input').value.trim().toLowerCase();
        const msg = document.getElementById('forgot-pw-msg');
        if (!inputVal) {
          msg.style.color = '#993C1D';
          msg.textContent = 'Vui lòng nhập tên đăng nhập hoặc email.';
          return;
        }

        submitBtn.disabled = true;
        msg.style.color = '#6b7a73';
        msg.textContent = 'Đang gửi yêu cầu khôi phục...';
        try {
          // Máy chủ tự sinh mật khẩu tạm, gửi email và KHÔNG đổi mật khẩu thật của tài khoản
          const { data: res, error: rpcErr } = await sb.rpc('bc_request_password_reset', { p_identifier: inputVal });
          submitBtn.disabled = false;
          if (rpcErr) throw rpcErr;
          const st = res && res.status;
          if (st === 'sent') {
            msg.style.color = '#27500A';
            msg.textContent = `Mật khẩu tạm thời (hiệu lực 30 phút) đã được gửi tới email ${res.email}. Vui lòng kiểm tra hộp thư (và cả mục Spam nếu không thấy).`;
            document.getElementById('forgot-pw-input').value = '';
          } else if (st === 'not_found') {
            msg.style.color = '#993C1D';
            msg.textContent = 'Không tìm thấy tài khoản phù hợp với thông tin đã nhập.';
          } else if (st === 'no_email') {
            msg.style.color = '#993C1D';
            msg.textContent = 'Tài khoản này chưa có email đăng ký, không thể khôi phục tự động. Vui lòng liên hệ Admin.';
          } else if (st === 'too_soon') {
            msg.style.color = '#993C1D';
            msg.textContent = 'Bạn vừa yêu cầu cách đây ít phút. Vui lòng kiểm tra email hoặc thử lại sau 3 phút.';
          } else if (st === 'mail_failed') {
            msg.style.color = '#993C1D';
            msg.textContent = 'Không gửi được email. Vui lòng liên hệ Admin để được hỗ trợ.';
          } else {
            msg.style.color = '#993C1D';
            msg.textContent = 'Vui lòng nhập tên đăng nhập hoặc email.';
          }
        } catch (e) {
          submitBtn.disabled = false;
          msg.style.color = '#993C1D';
          msg.textContent = 'Đã có lỗi xảy ra. Vui lòng thử lại sau.';
          console.error(e);
        }
      };
    }

    dialog.showModal();
  }

      <div class="a-greet" style="max-width:82%;">Vote lịch đánh, xem chi phí và xếp hạng của câu lạc bộ.</div>
      <div class="a-chips" style="margin-top:14px;"><span class="a-chip">👥 ${activeCount} thành viên</span>
        <button class="a-chip" id="auth-theme-toggle" style="border:0; cursor:pointer; font-family:inherit;" title="Đổi giao diện Sáng/Tối">${isDark ? '☀️ Sáng' : '🌙 Tối'}</button></div>
    </section>`);

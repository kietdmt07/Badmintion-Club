<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap');
  html {
    width: 100%;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }
  body {
    --bg-gradient: linear-gradient(135deg, #FAFBFD 0%, #E3EDF7 100%);
    --card-bg: rgba(255, 255, 255, 0.9);
    --card-border: rgba(162, 170, 187, 0.4);
    --card-hover-border: #F26419;
    --text-primary: #0D2040;
    --text-secondary: #4A5568;
    --text-muted: #718096;
    --input-bg: #FFFFFF;
    --input-border: #B0C4DE;
    --input-color: #0D2040;
    --tab-bg: rgba(255, 255, 255, 0.6);
    --tab-hover-bg: rgba(112, 162, 216, 0.15);
    --card-shadow: 0 6px 20px -4px rgba(13, 32, 64, 0.06), 0 3px 6px -2px rgba(0, 0, 0, 0.02);
    --card-hover-shadow: 0 12px 30px -4px rgba(13, 32, 64, 0.12), 0 5px 12px -2px rgba(0, 0, 0, 0.04);
    
    background: var(--bg-gradient);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    margin: 0;
    padding: 1.25rem 0.75rem;
    padding-top: max(1rem, env(safe-area-inset-top));
    padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
    padding-left: max(0.5rem, env(safe-area-inset-left));
    padding-right: max(0.5rem, env(safe-area-inset-right));
    color: var(--text-primary);
    transition: background 0.3s ease, color 0.3s ease;
  }

  
  body.dark-theme {
    --bg-gradient: linear-gradient(135deg, #0A192F 0%, #020C1B 100%);
    --card-bg: rgba(16, 28, 48, 0.88);
    --card-border: rgba(112, 162, 216, 0.2);
    --card-hover-border: #F26419;
    --text-primary: #F4F6F9;
    --text-secondary: #8892B0;
    --text-muted: #5A6785;
    --input-bg: #0E1B30;
    --input-border: #1E3A60;
    --input-color: #F4F6F9;
    --tab-bg: rgba(16, 28, 48, 0.5);
    --tab-hover-bg: rgba(112, 162, 216, 0.1);
    --card-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.4), 0 3px 6px -2px rgba(0, 0, 0, 0.3);
    --card-hover-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.6), 0 5px 12px -2px rgba(0, 0, 0, 0.4);
  }

  @keyframes pulse {
    0% { opacity: 0.9; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 0.9; transform: scale(1); }
  }

  @keyframes spotlightPulse {
    0% { box-shadow: 0 0 0 0 rgba(242, 100, 25, 0.45), 0 4px 20px rgba(242, 100, 25, 0.15); }
    70% { box-shadow: 0 0 0 10px rgba(242, 100, 25, 0), 0 4px 20px rgba(242, 100, 25, 0.15); }
    100% { box-shadow: 0 0 0 0 rgba(242, 100, 25, 0), 0 4px 20px rgba(242, 100, 25, 0.15); }
  }

  @keyframes beaconGlow {
    0% { transform: scale(0.92); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px rgba(242, 100, 25, 0.9)); }
    100% { transform: scale(0.92); opacity: 0.8; }
  }

  @keyframes shuttleBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-4px) rotate(10deg); }
  }

  @keyframes titleGlowPulse {
    0% { opacity: 0.9; filter: drop-shadow(0 0 0 rgba(242,100,25,0)); }
    50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(242,100,25,0.75)); color: #F26419; }
    100% { opacity: 0.9; filter: drop-shadow(0 0 0 rgba(242,100,25,0)); }
  }

  @keyframes xpRankGlow {
    0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.5), 0 2px 8px rgba(0,0,0,0.15); }
    50% { box-shadow: 0 0 0 5px rgba(255, 215, 0, 0), 0 2px 15px rgba(255, 200, 0, 0.4); }
    100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0), 0 2px 8px rgba(0,0,0,0.15); }
  }
  @keyframes xpRankShimmer {
    0% { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  @keyframes xpBarFill {
    from { width: 0%; }
  }
  @keyframes xpCountUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes rankBadgePop {
    0%   { transform: scale(0.5); opacity: 0; }
    70%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); }
  }
  @keyframes lbRowIn {
    from { opacity: 0; transform: translateX(-12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes crown-float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%       { transform: translateY(-4px) rotate(5deg); }
  }
  .xp-rank-legendary .xp-avatar-ring {
    animation: xpRankGlow 2s ease-in-out infinite;
  }
  .lb-row { animation: lbRowIn 0.35s ease both; }
  .lb-top1 { background: linear-gradient(135deg, rgba(255,215,0,0.18) 0%, rgba(255,180,0,0.06) 100%) !important; }
  .lb-top2 { background: linear-gradient(135deg, rgba(192,192,192,0.18) 0%, rgba(150,150,150,0.06) 100%) !important; }
  .lb-top3 { background: linear-gradient(135deg, rgba(205,127,50,0.18) 0%, rgba(160,90,30,0.06) 100%) !important; }

  #app * { box-sizing: border-box; }
  #app { font-family: 'Outfit', system-ui, sans-serif !important; color: var(--text-primary); }
  #app h1, #app h2, #app h3 { font-family: 'Oswald', sans-serif; letter-spacing: 0.01em; margin: 0; color: var(--text-primary); }
  .bc-card { 
    background: var(--card-bg); 
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--card-border); 
    border-radius: 16px; 
    padding: 1.25rem 1.4rem; 
    margin-bottom: 1rem; 
    box-shadow: var(--card-shadow);
    color: var(--text-primary);
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, background 0.3s ease;
  }
  .bc-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--card-hover-shadow);
    border-color: var(--card-hover-border);
  }
  .bc-btn { 
    font-family: 'Outfit', sans-serif; 
    border: 1px solid #134074; 
    background: linear-gradient(135deg, #134074 0%, #0A2540 100%); 
    color: #FFFFFF; 
    padding: 10px 20px; 
    border-radius: 10px; 
    font-size: 14px; 
    font-weight: 500; 
    cursor: pointer; 
    box-shadow: 0 4px 12px rgba(10, 37, 64, 0.15);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .bc-btn:hover { 
    background: linear-gradient(135deg, #F26419 0%, #FF7F50 100%); 
    border-color: #F26419;
    box-shadow: 0 6px 16px rgba(242, 100, 25, 0.3);
    transform: translateY(-1px);
  }
  .bc-btn:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 2px 6px rgba(10, 37, 64, 0.15);
  }
  .bc-btn.outline { 
    background: transparent; 
    color: var(--text-primary); 
    border: 1.5px solid var(--text-primary);
    box-shadow: none;
  }
  .bc-btn.outline:hover { 
    background: rgba(112, 162, 216, 0.12); 
    border-color: #F26419;
    color: #F26419;
    transform: translateY(-1px);
  }
  .bc-btn.danger { 
    background: transparent; 
    color: #E3A693; 
    border: 1.5px solid #E3A693; 
    box-shadow: none;
  }
  body:not(.dark-theme) .bc-btn.danger {
    color: #993C1D;
    border-color: #993C1D;
  }
  .bc-btn.danger:hover { 
    background: rgba(227, 166, 147, 0.08); 
    border-color: #E3A693;
    color: #E3A693;
    transform: translateY(-1px);
  }
  body:not(.dark-theme) .bc-btn.danger:hover {
    background: rgba(153, 60, 29, 0.08);
    border-color: #B23A1E;
    color: #B23A1E;
  }
  .bc-btn.small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .bc-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .bc-input, .bc-select { 
    font-family: 'Outfit', sans-serif; 
    border: 1.5px solid var(--input-border); 
    border-radius: 10px; 
    padding: 9px 12px; 
    font-size: 14px; 
    width: 100%; 
    background: var(--input-bg); 
    color: var(--input-color); 
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.3s ease, color 0.3s ease;
  }
  .bc-input:focus, .bc-select:focus { 
    outline: none; 
    border-color: #F26419; 
    box-shadow: 0 0 0 3px rgba(242, 100, 25, 0.15);
  }
  .bc-tab { 
    padding: 8px 16px; 
    border-radius: 10px; 
    font-size: 14px; 
    font-weight: 500; 
    cursor: pointer; 
    border: 1.5px solid transparent; 
    color: var(--text-secondary); 
    transition: all 0.2s ease;
    background: var(--tab-bg);
  }
  .bc-tab:hover {
    background: var(--tab-hover-bg);
    color: var(--text-primary);
  }
  .bc-tab.active { 
    background: #134074; 
    color: #FFFFFF; 
    box-shadow: 0 4px 12px rgba(19, 64, 116, 0.15);
  }
  body.dark-theme .bc-tab.active {
    background: #F26419;
    color: #FFFFFF;
    box-shadow: 0 4px 12px rgba(242, 100, 25, 0.2);
  }
  .bc-badge { display:inline-block; font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 500; }
  .bc-empty { text-align:center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 14px; }
  .bc-err { font-size: 13px; color: #E3A693; margin-top: 6px; }
  body:not(.dark-theme) .bc-err { color: #993C1D; }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .loader {
    width: 28px;
    height: 28px;
    border: 3px solid rgba(19, 64, 116, 0.15);
    border-top-color: #F26419;
    border-radius: 50%;
    animation: spin 0.8s infinite linear;
    display: inline-block;
  }

  /* Universal overrides mapping the old green scheme to the new royal navy / orange scheme */
  [style*="color: #1B4332"], [style*="color:#1B4332"] { color: var(--text-primary) !important; }
  [style*="background: rgba(27,67,50"], [style*="background:rgba(27,67,50"] { background: rgba(19, 64, 116, 0.08) !important; }
  [style*="color: #2D6A4F"], [style*="color:#2D6A4F"] { color: var(--card-hover-border) !important; }
  [style*="background: rgba(45,106,79"], [style*="background:rgba(45,106,79"] { background: rgba(242, 100, 25, 0.08) !important; }
  [style*="color: #40916C"], [style*="color:#40916C"] { color: var(--card-hover-border) !important; }
  [style*="background: rgba(64,145,108"], [style*="background:rgba(64,145,108"] { background: rgba(242, 100, 25, 0.08) !important; }
  [style*="border-left:4px solid #40916C"], [style*="border-left: 4px solid #40916C"] { border-left-color: #F26419 !important; }
  [style*="border:1px solid rgba(64, 145, 108, 0.2)"], [style*="border: 1px solid rgba(64, 145, 108, 0.2)"] { border-color: var(--card-border) !important; }
  [style*="border:1px solid rgba(64, 145, 108, 0.25)"], [style*="border: 1px solid rgba(64, 145, 108, 0.25)"] { border-color: var(--card-border) !important; }

  /* Dark mode overrides for common text color formats */
  body.dark-theme [style*="color: #6b7a73"], body.dark-theme [style*="color:#6b7a73"] { color: var(--text-secondary) !important; }
  body.dark-theme [style*="color: #8a877d"], body.dark-theme [style*="color:#8a877d"] { color: var(--text-muted) !important; }
  body.dark-theme [style*="color: #2c2c2a"], body.dark-theme [style*="color:#2c2c2a"], body.dark-theme [style*="color: #2C2C2A"], body.dark-theme [style*="color:#2C2C2A"] { color: var(--text-primary) !important; }
  body.dark-theme [style*="color: #1B4332"], body.dark-theme [style*="color:#1B4332"], body.dark-theme [style*="color: #27500A"], body.dark-theme [style*="color:#27500A"] { color: #A7F3D0 !important; }
  body.dark-theme [style*="color: #993C1D"], body.dark-theme [style*="color:#993C1D"] { color: #FCA5A5 !important; }
  body.dark-theme [style*="color: #854F0B"], body.dark-theme [style*="color:#854F0B"] { color: #FFB703 !important; }
  body.dark-theme [style*="color: #0C447C"], body.dark-theme [style*="color:#0C447C"], body.dark-theme [style*="color: #134074"], body.dark-theme [style*="color:#134074"] { color: #60A5FA !important; }
  body.dark-theme [style*="background: #FFF"], body.dark-theme [style*="background:#FFF"], body.dark-theme [style*="background: white"], body.dark-theme [style*="background:white"] { background: var(--input-bg) !important; }
  body.dark-theme [style*="background: #fff"], body.dark-theme [style*="background:#fff"] { background: var(--input-bg) !important; }
  body.dark-theme [style*="background: rgba(0,0,0,0.02)"], body.dark-theme [style*="background:rgba(0,0,0,0.02)"] { background: rgba(255, 255, 255, 0.02) !important; }
  body.dark-theme [style*="background: rgba(0,0,0,0.01)"], body.dark-theme [style*="background:rgba(0,0,0,0.01)"] { background: rgba(255, 255, 255, 0.01) !important; }
  body.dark-theme [style*="background: #F4F1EA"], body.dark-theme [style*="background:#F4F1EA"] { background: var(--card-bg) !important; }
  body.dark-theme .bc-card[style*="background"] { background: var(--card-bg) !important; border-color: var(--card-border) !important; }
  body.dark-theme [style*="background:#EFEDE3"], body.dark-theme [style*="background: #EFEDE3"] { background: rgba(255, 255, 255, 0.1) !important; }
  body.dark-theme [style*="border-top:1px solid #F1EFE8"], body.dark-theme [style*="border-top: 1px solid #F1EFE8"] { border-top-color: var(--card-border) !important; }
  body.dark-theme [style*="border:1px solid #E3E0D6"], body.dark-theme [style*="border: 1px solid #E3E0D6"] { border-color: var(--card-border) !important; }
  body.dark-theme [style*="background: #FFFDF9"], body.dark-theme [style*="background:#FFFDF9"] { background: var(--input-bg) !important; }
  body.dark-theme td, body.dark-theme th { color: var(--text-primary) !important; }
  body.dark-theme th { background: rgba(255, 255, 255, 0.02) !important; }
  body.dark-theme [style*="background:#EAF3DE"], body.dark-theme [style*="background: #EAF3DE"] { background: rgba(19, 64, 116, 0.2) !important; color: #FFF !important; }
  body.dark-theme [style*="background:#FAECE7"], body.dark-theme [style*="background: #FAECE7"] { background: rgba(242, 100, 25, 0.2) !important; color: #FFF !important; }

<style id="aron-ui">
/* =====================================================================
   ARON UI — hệ thiết kế mới (màu lấy từ bộ nhận diện ARON)
   Navy #002070 · Cam #FF831C · Teal #074659 · Vàng #F1B13F · San hô #C04030
   ===================================================================== */
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap');

body {
  --a-navy:#002070; --a-orange:#FF831C; --a-petrol:#074659; --a-petrol-2:#0B5E75;
  --a-gold:#F1B13F; --a-coral:#C04030; --a-coral-soft:#FC7D60; --a-mist:#C6D2D3; --a-sky:#96CAFF;
  --a-bg:#F2F6F6; --a-surface:#FFFFFF; --a-surface-2:#F5F8F8; --a-line:#DDE7E8;
  --a-ink:#0B2530; --a-ink-2:#4A6670; --a-ink-3:#789099;
  --a-primary:#074659; --a-on-primary:#FFFFFF; --a-accent:#FF831C; --a-kicker:#C04030;
  --a-ok:#16795A; --a-ok-bg:#E1F3EB; --a-bad:#B83A2A; --a-bad-bg:#FBE9E5;
  --a-warn:#8F5A00; --a-warn-bg:#FFF0CF; --a-info:#002070; --a-info-bg:#E7F0FF;
  --a-gold-bg:#FFF4D9; --a-gold-ink:#7A5200;
  --a-shadow:0 1px 2px rgba(7,70,89,.06), 0 8px 24px -10px rgba(7,70,89,.20);
  --a-font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* ánh xạ sang biến cũ để các màn hình chưa làm lại tự đổi màu */
  --bg-gradient:#F2F6F6; --card-bg:var(--a-surface); --card-border:var(--a-line);
  --card-hover-border:var(--a-line); --text-primary:var(--a-ink); --text-secondary:var(--a-ink-2);
  --text-muted:var(--a-ink-3); --input-bg:#FFFFFF; --input-border:#C9D7D9; --input-color:var(--a-ink);
  --tab-bg:rgba(7,70,89,.06); --tab-hover-bg:rgba(7,70,89,.10);
  --card-shadow:var(--a-shadow); --card-hover-shadow:var(--a-shadow);
}
body.dark-theme {
  --a-bg:#041F29; --a-surface:#08303D; --a-surface-2:#0B3A49; --a-line:rgba(198,210,211,.16);
  --a-ink:#EAF3F4; --a-ink-2:#B3C8CD; --a-ink-3:#84A1A9;
  --a-primary:#FF831C; --a-on-primary:#1B0F00; --a-kicker:#FC7D60;
  --a-ok:#58D6A6; --a-ok-bg:rgba(88,214,166,.14); --a-bad:#FF9C8A; --a-bad-bg:rgba(255,156,138,.14);
  --a-warn:#F1B13F; --a-warn-bg:rgba(241,177,63,.15); --a-info:#96CAFF; --a-info-bg:rgba(150,202,255,.14);
  --a-gold-bg:rgba(241,177,63,.16); --a-gold-ink:#F7CD7A;
  --a-shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px -12px rgba(0,0,0,.55);
  --bg-gradient:#041F29; --input-bg:#0B3A49; --input-border:rgba(198,210,211,.22);
  --tab-bg:rgba(255,255,255,.06); --tab-hover-bg:rgba(255,255,255,.1);
}

html { background: var(--a-bg); }
body { background: var(--a-bg) !important; padding: 0 !important; color: var(--a-ink); font-family: var(--a-font); }
#app { font-family: var(--a-font) !important; color: var(--a-ink); max-width: 720px; }
#app h1, #app h2, #app h3 { font-family: var(--a-font); letter-spacing: 0; color: var(--a-ink); }
#app [style*="Oswald"] { font-family: var(--a-font) !important; letter-spacing: 0 !important; }
#root { padding: 0 14px calc(110px + env(safe-area-inset-bottom)); }
#root > .a-topbar + * { margin-top: 6px; }

/* ---------- Thanh trên ---------- */
.a-topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
  margin: 0 -14px 10px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: color-mix(in srgb, var(--a-bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.a-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.a-logo-mark { display: block; width: 38px; height: 38px; border-radius: 12px; background: var(--a-navy); position: relative; flex: none; overflow: hidden; }
.a-logo-mark::before { content: ''; position: absolute; left: -6px; bottom: -6px; width: 22px; height: 22px; background: var(--a-orange); transform: rotate(45deg); opacity: .95; }
.a-logo-mark i { position: absolute; right: 7px; top: 7px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-sizing: border-box; }
.a-logo-img { width: 38px; height: 38px; border-radius: 12px; object-fit: cover; flex: none; background: transparent; }
.a-brand-t { font-weight: 800; font-size: 16px; line-height: 1.15; color: var(--a-ink); letter-spacing: .01em; }
.a-brand-s { font-size: 12px; color: var(--a-ink-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-iconbtn { border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 50%; display: grid; place-items: center; color: var(--a-ink); }
.a-me { box-shadow: 0 0 0 2px var(--a-bg), 0 0 0 4px var(--a-mist); }

.a-av { display: inline-grid; place-items: center; border-radius: 50%; overflow: hidden; color: #fff; font-weight: 700; background: var(--a-petrol); flex: none; line-height: 1; }
.a-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.a-stack { display: flex; align-items: center; }
.a-stack .a-av { box-shadow: 0 0 0 2px var(--a-surface); margin-left: -9px; }
.a-stack .a-av:first-child { margin-left: 0; }
.a-stack .a-more { margin-left: -9px; background: var(--a-surface-2); color: var(--a-ink-2); font-size: 11px; box-shadow: 0 0 0 2px var(--a-surface); }

/* ---------- Thanh điều hướng dưới ---------- */
.a-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; display: flex; justify-content: center; }
.a-nav-in { pointer-events: auto; width: min(560px, 100%); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px;
  background: var(--a-surface); border: 1px solid var(--a-line); border-radius: 24px; box-shadow: 0 14px 34px -12px rgba(7,70,89,.45); }
body.dark-theme .a-nav-in { box-shadow: 0 14px 34px -10px rgba(0,0,0,.7); }
.a-nav-i { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 2px 3px; cursor: pointer; color: var(--a-ink-3); font-family: var(--a-font); }
.a-nav-ic { position: relative; width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .18s, color .18s; }
.a-nav-l { font-size: 11px; font-weight: 600; letter-spacing: .01em; }
.a-nav-i.on { color: var(--a-ink); }
.a-nav-i.on .a-nav-ic { background: var(--a-primary); color: var(--a-on-primary); }
.a-nav-i.on .a-nav-l { font-weight: 700; }
.a-badge { position: absolute; top: -4px; right: 6px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--a-coral); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--a-surface); }

/* ---------- Bottom sheet ---------- */
.a-backdrop { position: fixed; inset: 0; z-index: 90; background: rgba(4,33,43,.55); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; animation: a-fade .16s ease; }
.a-sheet { width: min(560px, 100%); max-height: 88vh; overflow: auto; background: var(--a-surface); color: var(--a-ink); border-radius: 26px 26px 0 0; padding: 10px 18px calc(22px + env(safe-area-inset-bottom)); animation: a-up .24s cubic-bezier(.2,.8,.2,1); }
.a-sheet .a-grab { width: 42px; height: 4px; border-radius: 4px; background: var(--a-line); margin: 0 auto 14px; }
.a-sheet h3 { font-size: 17px; font-weight: 800; margin: 2px 0 10px; }
@keyframes a-fade { from { opacity: 0; } }
.a-backdrop.instant, .a-backdrop.instant .a-sheet { animation: none; }
@keyframes a-up { from { transform: translateY(40px); opacity: .4; } }
.a-acc { display: flex; gap: 14px; align-items: center; padding: 4px 0 14px; }
.a-acc-n { font-weight: 800; font-size: 17px; }
.a-acc-u { font-size: 12.5px; color: var(--a-ink-3); margin: 1px 0 8px; word-break: break-all; }
.a-list { display: flex; flex-direction: column; gap: 6px; }
.a-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: var(--a-surface-2); color: var(--a-ink); padding: 14px 14px; border-radius: 16px; font: 600 15px var(--a-font); cursor: pointer; }
.a-row > span { flex: 1; }
.a-row .a-ic { flex: none; color: var(--a-primary); }
body.dark-theme .a-row .a-ic { color: var(--a-gold); }
.a-row.danger { color: var(--a-bad); }
.a-row.danger .a-ic { color: var(--a-bad); }
.a-row .a-badge { position: static; box-shadow: none; }

/* ---------- Thành phần chung ---------- */
.a-card { background: var(--a-surface); border: 1px solid var(--a-line); border-radius: 22px; padding: 16px; margin-bottom: 14px; box-shadow: var(--a-shadow); }
.a-kicker { font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--a-kicker); }
.a-h2 { font-size: 18px; font-weight: 800; margin: 0; color: var(--a-ink); }
.a-sub { font-size: 13px; color: var(--a-ink-3); }
.a-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.a-chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font: 700 12px var(--a-font); background: var(--a-surface-2); color: var(--a-ink-2); white-space: nowrap; }
.a-chip.ok { background: var(--a-ok-bg); color: var(--a-ok); }
.a-chip.bad { background: var(--a-bad-bg); color: var(--a-bad); }
.a-chip.warn { background: var(--a-warn-bg); color: var(--a-warn); }
.a-chip.info { background: var(--a-info-bg); color: var(--a-info); }
.a-chip.gold { background: var(--a-gold-bg); color: var(--a-gold-ink); }
.a-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 15px; border: 1.5px solid transparent; background: var(--a-primary); color: var(--a-on-primary); font: 700 15px var(--a-font); cursor: pointer; transition: transform .12s, filter .15s; }
.a-btn:active { transform: scale(.97); }
.a-btn:hover { filter: brightness(1.06); }
.a-btn:disabled { opacity: .45; cursor: not-allowed; }
.a-btn.sm { min-height: 38px; padding: 0 14px; font-size: 13.5px; border-radius: 12px; }
.a-btn.block { width: 100%; }
.a-btn.ghost { background: transparent; color: var(--a-ink); border-color: var(--a-line); }
.a-btn.ghost:hover { background: var(--a-surface-2); filter: none; }
.a-btn.ok { background: var(--a-ok); color: #fff; }
body.dark-theme .a-btn.ok { color: #04251a; }
.a-btn.bad { background: var(--a-bad); color: #fff; }
body.dark-theme .a-btn.bad { color: #3a0d05; }
.a-btn.gold { background: var(--a-gold); color: #2b1c00; }
.a-btn-link { border: 0; background: none; color: var(--a-primary); font: 700 13.5px var(--a-font); cursor: pointer; padding: 6px 2px; }
body.dark-theme .a-btn-link { color: var(--a-gold); }
.a-pagehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 6px 2px 12px; }
.a-seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--a-surface-2); border: 1px solid var(--a-line); border-radius: 16px; margin-bottom: 12px; }
.a-seg button, .a-seg .bc-tab { border: 0; background: transparent; padding: 10px 8px; border-radius: 12px; font: 700 14px var(--a-font); color: var(--a-ink-2); cursor: pointer; }
.a-seg button.on, .a-seg .bc-tab.active, body.dark-theme .a-seg .bc-tab.active { background: var(--a-surface); color: var(--a-ink); box-shadow: 0 1px 3px rgba(7,70,89,.18); }

#auth-login-btn, #auth-register-btn { min-height: 50px; font-size: 16px; border-radius: 15px; }
.a-seg .bc-tab { text-align: center; }

/* ---------- Thẻ chào (hero) ---------- */
.a-hero { position: relative; overflow: hidden; border-radius: 26px; padding: 18px 18px 16px; margin-bottom: 14px; color: #fff;
  background: linear-gradient(140deg, #074659 0%, #0A5870 55%, #0D6B87 100%); box-shadow: 0 18px 34px -16px rgba(7,70,89,.7); }
.a-hero::before { content: ''; position: absolute; right: 0; top: 0; width: 150px; height: 150px;
  background: linear-gradient(225deg, var(--a-coral-soft) 0 16px, transparent 16px 23px, var(--a-gold) 23px 39px, transparent 39px 46px, rgba(198,210,211,.8) 46px 62px, transparent 62px); }
.a-hero::after { content: ''; position: absolute; left: -40px; bottom: -50px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.10), transparent 70%); }
.a-hero > * { position: relative; z-index: 1; }
.a-hero .a-greet { font-size: 13.5px; opacity: .85; font-weight: 500; }
.a-hero .a-name { font-size: 25px; font-weight: 800; line-height: 1.15; margin: 2px 0 12px; max-width: 70%; }
.a-hero .a-chip { background: rgba(255,255,255,.14); color: #fff; }
.a-hero .a-chip.gold { background: var(--a-gold); color: #2b1c00; }
.a-xp { margin-top: 14px; }
.a-xp-bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.18); overflow: hidden; }
.a-xp-bar i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--a-orange), var(--a-gold)); }
.a-xp-t { display: flex; justify-content: space-between; font-size: 12px; opacity: .85; margin-top: 6px; }

/* ---------- Buổi tới ---------- */
.a-next { border-left: 5px solid var(--a-orange); }
.a-next-top { display: flex; gap: 14px; align-items: center; margin: 10px 0 12px; }
.a-date { flex: none; width: 58px; height: 62px; border-radius: 16px; background: var(--a-primary); color: var(--a-on-primary); display: grid; place-items: center; align-content: center; line-height: 1; }
.a-date b { font-size: 24px; font-weight: 800; }
.a-date span { font-size: 11px; font-weight: 700; opacity: .85; margin-top: 3px; letter-spacing: .03em; }
.a-date.hot { background: var(--a-orange); color: #2b1300; }
.a-date.sm { width: 46px; height: 50px; border-radius: 13px; }
.a-date.sm b { font-size: 19px; }
.a-date.dim { background: var(--a-surface-2); color: var(--a-ink-2); box-shadow: inset 0 0 0 1px var(--a-line); }
.a-next-t { font-size: 17px; font-weight: 800; line-height: 1.25; }
.a-next-s { font-size: 13.5px; color: var(--a-ink-2); margin-top: 3px; }
.a-vote { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.a-vote .a-btn { min-height: 54px; font-size: 16px; }
.a-vote .a-note { grid-column: 1 / -1; margin: 0; }
.a-vote .a-btn.off { background: var(--a-surface-2); color: var(--a-ink-2); border-color: var(--a-line); }
.a-vote .a-btn.off:hover { filter: none; background: var(--a-surface); }
.a-note { margin-top: 12px; padding: 11px 13px; border-radius: 14px; background: var(--a-surface-2); color: var(--a-ink-2); font-size: 13px; line-height: 1.45; }
.a-note.warn { background: var(--a-warn-bg); color: var(--a-warn); }

/* ---------- Tiền ---------- */
.a-money { font-size: 30px; font-weight: 800; letter-spacing: -.01em; margin: 4px 0 2px; }
.a-money.due { color: var(--a-bad); }
.a-money.ok { color: var(--a-ok); }
.a-lines { display: grid; gap: 4px; font-size: 13px; color: var(--a-ink-2); margin-bottom: 12px; }
.a-lines div { display: flex; justify-content: space-between; }

/* ---------- Việc cần xử lý / tin ---------- */
.a-todo { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; text-align: left; padding: 12px; margin-top: 8px; border-radius: 16px; background: var(--a-surface-2); color: var(--a-ink); font: 600 14px var(--a-font); cursor: pointer; }
.a-todo > span:nth-child(2) { flex: 1; }
.a-coin { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--a-gold); color: #2b1c00; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.a-coin.zero { background: var(--a-ok-bg); color: var(--a-ok); }
.a-news { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--a-line); cursor: pointer; }
.a-news:first-of-type { border-top: 0; }
.a-news-t { font-weight: 700; font-size: 14px; line-height: 1.35; }
.a-news-c { font-size: 13px; color: var(--a-ink-2); margin-top: 2px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.a-news-ic { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--a-info-bg); font-size: 17px; }

/* ---------- Danh sách buổi (Lịch đánh) ---------- */
.a-srow { background: var(--a-surface); border: 1px solid var(--a-line); border-radius: 22px; margin-bottom: 12px; box-shadow: var(--a-shadow); overflow: hidden; }
.a-srow.open { border-color: color-mix(in srgb, var(--a-primary) 40%, var(--a-line)); }
.a-srow-main { display: flex; gap: 14px; align-items: center; padding: 14px; cursor: pointer; }
.a-srow-i { flex: 1; min-width: 0; }
.a-srow-t { font-weight: 800; font-size: 15.5px; line-height: 1.25; }
.a-srow-s { font-size: 13px; color: var(--a-ink-2); margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-chev { color: var(--a-ink-3); transition: transform .2s; flex: none; }
.a-srow.open .a-chev { transform: rotate(90deg); }
.a-srow-vote { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 14px; }
.a-srow-vote .a-btn { min-height: 44px; }
.a-srow-vote .a-btn.off { background: var(--a-surface-2); color: var(--a-ink-2); border-color: var(--a-line); }
.a-srow-vote .a-note { grid-column: 1 / -1; margin: 0; }
.a-srow-detail { padding: 0 8px 10px; border-top: 1px dashed var(--a-line); }
.a-srow-detail > .bc-card { box-shadow: none; border: 0; background: transparent; padding: 10px 6px; margin: 0; }
.a-empty { text-align: center; padding: 34px 16px; color: var(--a-ink-3); font-size: 14px; background: var(--a-surface); border: 1px dashed var(--a-line); border-radius: 22px; margin-bottom: 12px; }
.a-more { display: flex; justify-content: center; margin: 6px 0 18px; }

/* Bảng tin (gập lại mặc định) */
.a-bulletin.bc-card { background: var(--a-surface) !important; border: 1px solid var(--a-line) !important; padding: 14px 16px; }
.a-bulletin.closed #ann-list-container, .a-bulletin.closed #ann-form-container { display: none !important; }
.a-bulletin > div:first-child { margin-bottom: 0 !important; cursor: pointer; }
.a-bulletin:not(.closed) > div:first-child { margin-bottom: 10px !important; }
.a-bulletin > div:first-child h2 { font-size: 12.5px !important; letter-spacing: .09em !important; text-transform: uppercase; color: var(--a-kicker) !important; font-weight: 800 !important; }
.a-bulletin > div:first-child h2::after { content: '›'; display: inline-block; margin-left: 8px; font-size: 20px; line-height: 1; transform: rotate(90deg); transition: transform .2s; color: var(--a-ink-3); }
.a-bulletin.closed > div:first-child h2::after { transform: rotate(0deg); }
.a-bulletin #ann-list-container .bc-card { background: var(--a-surface-2) !important; border: 1px solid var(--a-line) !important; border-radius: 16px !important; box-shadow: none; }

/* Bảng vote trong chi tiết buổi: mỗi thành viên một dòng gọn */
.a-vlist, .a-vlist tbody { display: block; width: 100%; }
.a-vlist tr { display: grid; grid-template-columns: 34px 1fr auto; grid-template-areas: "av nm st" "av ty st" ". pa pa"; align-items: center; column-gap: 10px; padding: 8px 4px; border-radius: 12px; }
.a-vlist td { padding: 0 !important; border: 0 !important; width: auto !important; }
.a-vlist td:nth-child(1) { grid-area: av; }
.a-vlist td:nth-child(2) { grid-area: nm; min-width: 0; }
.a-vlist td:nth-child(3) { grid-area: ty; font-size: 11.5px; }
.a-vlist td:nth-child(4) { grid-area: pa; margin-top: 6px; }
.a-vlist td:nth-child(5) { grid-area: st; text-align: right; }
.a-vlist td:empty { display: none; }
.a-vlist td:nth-child(4) select { width: 100% !important; }

/* ---------- Hồ sơ ---------- */
.a-prof-head { display: flex; gap: 16px; align-items: center; }
.a-prof-av { position: relative; flex: none; cursor: pointer; display: block; }
.a-prof-cam { position: absolute; right: -2px; bottom: -2px; width: 28px; height: 28px; border-radius: 50%; background: var(--a-orange); color: #2b1300; display: grid; place-items: center; box-shadow: 0 0 0 3px var(--a-surface); }
.a-form { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
.a-form label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--a-ink-2); }
.a-form .a-btn { margin-top: 4px; }
.a-msg { font-size: 13px; min-height: 18px; font-weight: 600; }
.a-xp-bar-dark { height: 8px; border-radius: 8px; background: var(--a-surface-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--a-line); }
.a-xp-bar-dark i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--a-orange), var(--a-gold)); }
.a-seg button:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- Thành viên ---------- */
.a-mrow { background: var(--a-surface); border: 1px solid var(--a-line); border-radius: 20px; margin-bottom: 10px; box-shadow: var(--a-shadow); overflow: hidden; }
.a-mrow-main { display: flex; align-items: center; gap: 12px; padding: 12px 14px; cursor: pointer; }
.a-mav { flex: none; }
.a-mi { flex: 1; min-width: 0; }
.a-mn { font-weight: 800; font-size: 15px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-ms { font-size: 12.5px; color: var(--a-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-mrow-act { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 14px; }
.a-chiprow { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
.a-chiprow::-webkit-scrollbar { display: none; }
.a-chiprow .bc-tab { flex: none; white-space: nowrap; padding: 8px 14px; font-size: 13.5px; }
.a-mtools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.a-mtools .bc-input { min-height: 40px; padding: 7px 10px; }
.a-search { display: flex; gap: 8px; margin-bottom: 12px; }
.a-search .bc-input { flex: 1; min-width: 0; }
.a-statline { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--a-ink-2); margin-bottom: 12px; }
.a-statline b { color: var(--a-ink); font-weight: 800; }
.a-paginator { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 16px; font-size: 13px; color: var(--a-ink-2); }

/* Chi tiết thành viên trong sheet */
.a-mdetail .a-mhead { display: flex; gap: 14px; align-items: center; }
.a-mdetail .a-mname { font-size: 18px; font-weight: 800; line-height: 1.2; }
.a-mdetail .a-mcontact { font-size: 13px; color: var(--a-ink-3); margin-top: 3px; word-break: break-all; }
.a-mdetail .a-chips { margin-top: 10px; }
.a-mdetail .a-mblock { margin-top: 16px; padding: 14px; border-radius: 18px; background: var(--a-surface-2); }
.a-mdetail .a-label { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--a-kicker); margin-bottom: 8px; }
.a-mdetail .a-mblock .bc-select { width: 100%; }
.a-mdetail .a-edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.a-mdetail .a-edit .bc-input, .a-mdetail .a-edit .bc-select { width: 100% !important; height: auto !important; padding: 10px 12px !important; font-size: 15px !important; min-height: 44px; }
.a-mdetail .a-edit .full { grid-column: 1 / -1; }
.a-mdetail .a-mactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.a-mdetail .a-mactions .bc-btn { flex: 1 1 calc(50% - 8px); min-height: 46px; font-size: 14px; border-radius: 14px; padding: 0 12px; }
.a-mdetail .a-mactions .bc-select { flex: 1 1 100%; min-height: 46px; width: 100% !important; border-radius: 14px; }

  // Hàm kiểm tra vote đúng giờ: trước 10h sáng ngày hôm trước buổi đánh
  function isVoteOnTime(session, memberId, memberName) {
    if (session.autoVoted && session.autoVoted[memberId]) return false;
    
    // Dữ liệu cũ chưa có timestamp thì tính mặc định là đúng giờ
    if (!session.voteTimestamps || !session.voteTimestamps[memberName]) return true;

    if (session.date) {
      const [yyyy, mm, dd] = session.date.split('-');
      const deadline = new Date(yyyy, mm - 1, dd);
      deadline.setDate(deadline.getDate() - 1);
      deadline.setHours(10, 0, 0, 0);
      return session.voteTimestamps[memberName] <= deadline.getTime();
    }
    return true;
  }

  function getXPRank(xp) {
    for (let i = XP_RANKS.length - 1; i >= 0; i--) {
      if (xp >= XP_RANKS[i].min) return XP_RANKS[i];
    }
    return XP_RANKS[0];
  }

  // Tính XP của 1 thành viên dựa trên toàn bộ sessions (tự động tích lũy từ lịch sử)
  function calculateMemberXP(memberId, sessions) {
    if (!sessions || !memberId) return 0;
    const mem = state.members.find(m => m.id === memberId);
    const memberName = mem ? mem.name : null;
    if (!memberName) return 0;
    
    const seasonStart = (state.settings && state.settings.xpSeasonStartDate) || null;
    let filteredSessions = [...sessions];
    if (seasonStart) {
      filteredSessions = filteredSessions.filter(s => (s.date || '') >= seasonStart);
    }
    
    let xp = 0;
    let streakCount = 0;
    const sortedSessions = filteredSessions.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    sortedSessions.forEach(s => {
      const votes = s.votes || {};
      const passes = s.passes || {};
      const v = votes[memberName];
      const isReceiver = Object.values(passes).includes(memberId);
      const hasPassed   = Object.keys(passes).includes(memberId);
      
      if (isReceiver || (v === 'yes' && !hasPassed)) {
        xp += 50; // +50 XP mỗi buổi tham gia
        streakCount++;
        if (streakCount === 2) xp += 30; // +30 XP chuỗi 2 buổi liên tiếp
        if (streakCount >= 4) xp += 50; // +50 XP chuỗi 4 buổi hoàn hảo
      } else if (v === 'no' || hasPassed) {
        streakCount = 0;
      }

      // +15 XP nếu tự vote đúng giờ (trước 10h sáng ngày hôm trước)
      if ((v === 'yes' || v === 'no') && isVoteOnTime(s, memberId, memberName)) {
        xp += 15;
      }

      // + XP từ Thách đấu trong lịch sử (chỉ tính khi trận đấu ĐÃ HOÀN THÀNH)
      (s.challenges || []).forEach(c => {
        const isDone = c.status === 'done' || (c.score1 !== null && c.score2 !== null && c.score1 !== undefined && c.score2 !== undefined);
        if (isDone) {
          if (c.createdBy === memberName) xp += 15; // +15 XP khi trận đấu hoàn thành
          const s1 = parseInt(c.score1, 10) || 0;
          const s2 = parseInt(c.score2, 10) || 0;
          if ((c.team1 || []).includes(memberName)) {
            if (s1 > s2) xp += 40;      // Thắng +40 XP
            else if (s1 < s2) xp += 15; // Thua +15 XP
            else xp += 25;              // Hòa +25 XP
          }
          if ((c.team2 || []).includes(memberName)) {
            if (s2 > s1) xp += 40;      // Thắng +40 XP
            else if (s2 < s1) xp += 15; // Thua +15 XP
            else xp += 25;              // Hòa +25 XP
          }
        }
      });
    });
    return Math.max(0, xp);
  }

  // Tính XP tháng của 1 thành viên (dùng cho bảng XH tháng)
  function calculateMemberMonthXP(memberId, sessions, month) {
    if (!sessions || !memberId) return 0;
    const mem = state.members.find(m => m.id === memberId);
    const memberName = mem ? mem.name : null;
    if (!memberName) return 0;
    let xp = 0;
    let streakCount = 0;
    const monthSessions = sessions.filter(s => sessionMonthKey(s) === month)
      .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    monthSessions.forEach(s => {
      const votes = s.votes || {};
      const passes = s.passes || {};
      const v = votes[memberName];
      const isReceiver = Object.values(passes).includes(memberId);
      const hasPassed   = Object.keys(passes).includes(memberId);

      if (isReceiver || (v === 'yes' && !hasPassed)) {
        xp += 50; // +50 XP mỗi buổi tham gia
        streakCount++;
        if (streakCount === 2) xp += 30;
        if (streakCount >= 4) xp += 50;
      } else if (v === 'no' || hasPassed) {
        streakCount = 0;
      }

      if ((v === 'yes' || v === 'no') && isVoteOnTime(s, memberId, memberName)) {
        xp += 15; // +15 XP vote đúng giờ
      }

      (s.challenges || []).forEach(c => {
        const isDone = c.status === 'done' || (c.score1 !== null && c.score2 !== null && c.score1 !== undefined && c.score2 !== undefined);
        if (isDone) {
          if (c.createdBy === memberName) xp += 15; // +15 XP khi trận đấu hoàn thành
          const s1 = parseInt(c.score1, 10) || 0;
          const s2 = parseInt(c.score2, 10) || 0;
          if ((c.team1 || []).includes(memberName)) {
            if (s1 > s2) xp += 40;
            else if (s1 < s2) xp += 15;
            else xp += 25;
          }
          if ((c.team2 || []).includes(memberName)) {
            if (s2 > s1) xp += 40;
            else if (s2 < s1) xp += 15;
            else xp += 25;
          }
        }
      });
    });
    return Math.max(0, xp);
  }



  // Số buổi tham gia của 1 thành viên (toàn thời gian)
  function countAttended(memberId, sessions) {
    if (!sessions) return 0;
    const mem = state.members.find(m => m.id === memberId);
    const memberName = mem ? mem.name : null;
    if (!memberName) return 0;
    return sessions.filter(s => {
      const passes = s.passes || {};
      const v = (s.votes || {})[memberName];
      const isReceiver = Object.values(passes).includes(memberId);
      const hasPassed   = Object.keys(passes).includes(memberId);
      if (!v && !isReceiver) return false;
      return isReceiver || (v === 'yes' && !hasPassed);
    }).length;
  }

  function getMemberChallengeWins(memberName, sessions) {
    if (!sessions || !memberName) return 0;
    let wins = 0;
    sessions.forEach(s => {
      (s.challenges || []).forEach(c => {
        const isDone = c.status === 'done' || (c.score1 !== null && c.score2 !== null && c.score1 !== undefined && c.score2 !== undefined);
        if (isDone) {
          const s1 = parseInt(c.score1, 10) || 0;

          if ((c.team1 || []).includes(memberName) && s1 > s2) wins++;

        }
      });

  function getMemberBadges(memberId, sessions) {
    if (!memberId || !sessions) return [];
    const mem = state.members.find(m => m.id === memberId);
    if (!mem) return [];
    const memberName = mem.name;
    const badges = [];

    // 1. Diligent (10+ attended)
    const attended = countAttended(memberId, sessions);
    if (attended >= 10) badges.push(BADGES[4]);

    // 2. XP Rank Master/Legendary (XP >= 700)
    const xp = calculateMemberXP(memberId, sessions);
    if (xp >= 700) badges.push(BADGES[3]);

    // 3. Challenge Wins (3+)
    const wins = getMemberChallengeWins(memberName, sessions);
    if (wins >= 3) badges.push(BADGES[1]);

    // 4. Streak Fire (current streak >= 3)
    let streak = 0;
    const sorted = [...sessions].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    sorted.forEach(s => {
      const passes = s.passes || {};
      const v = (s.votes || {})[memberName];
      const isReceiver = Object.values(passes).includes(memberId);
      const hasPassed   = Object.keys(passes).includes(memberId);
      if (isReceiver || (v === 'yes' && !hasPassed)) {
        streak++;
      } else if (v === 'no' || hasPassed) {
        streak = 0;
      }
    });
    if (streak >= 3) badges.push(BADGES[0]);

    // 5. Sniper Vote (5+ manual votes)
    let manualVotes = 0;
    sessions.forEach(s => {
      const v = (s.votes || {})[memberName];
      if ((v === 'yes' || v === 'no') && isVoteOnTime(s, memberId, memberName)) {
        manualVotes++;
      }
    });
    if (manualVotes >= 5) badges.push(BADGES[2]);

    return badges.filter(Boolean);
  }

  function monthKey(d){ d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function monthLabel(key){ const [y,m] = key.split('-'); return MONTH_NAMES[parseInt(m,10)-1] + '/' + y; }
  function sessionMonthKey(s){ return (s.date || '').slice(0,7) || monthKey(); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function normEmail(e){ return (e||'').trim().toLowerCase(); }
  function normUsername(u){ return (u||'').trim().toLowerCase().replace(/\s+/g,''); }
  function removeVietnameseTones(str) {
    if (!str) return '';
    str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
    str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
    str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
    str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
    str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
    str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
    str = str.replace(/đ/g, "d");
    str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
    str = str.replace(/È|É|Ẹ|Ẻ|Ẽ|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
    str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
    str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
    str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
    str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
    str = str.replace(/Đ/g, "D");
    str = str.replace(/\u0300|\u0301|\u0309|\u0303|\u0323/g, "");
    str = str.replace(/\u02C6|\u0306|\u031B/g, "");
    return str;
  }
  async function hashPassword(password, username) {
    if (!password) return '';
    const encoder = new TextEncoder();
    const salt = normUsername(username);
    const data = encoder.encode(password + salt + "badminton_secure_salt_9988");
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function sendSystemEmail(to, subject, htmlBody) {
    const config = (state.settings && state.settings.mailServer) || {};
    if (!config.enabled) {
      console.warn('Mail server is disabled. Email not sent.');
      return false;
    }
    try {
      // 1. Ưu tiên Google Apps Script nếu User đã cấu hình và bật
      if (config.useGoogleScript && config.googleScriptUrl && config.googleScriptUrl !== '••••') {
        const payload = {
          to: to,
          subject: subject,
          body: htmlBody
        };
        // Sử dụng mode: 'no-cors' để tránh lỗi CORS khi Google Redirect (302) sang googleusercontent
        await fetch(config.googleScriptUrl, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        return true;
      }

      // 2. Gửi qua Database RPC nếu không dùng Google Script (Bảo mật tuyệt đối, tránh lộ Credentials ở Client)
      try {
        const ea = authArgs();
        const { data: rpcRes, error: rpcError } = await sb.rpc('bc_send_email', {
          p_to: to,
          p_subject: subject,
          p_body: htmlBody,
          p_auth_username: ea.p_username,
          p_auth_password_hash: ea.p_password_hash
        });
        if (!rpcError) {
          if (rpcRes && typeof rpcRes === 'string' && rpcRes.startsWith('ERROR')) {
            console.warn('DB RPC error response:', rpcRes);
          } else {
            console.log('Email sent successfully via DB RPC.');
            return true;

  function compressImage(file, maxDim, quality, callback) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width;
        let h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        callback(dataUrl);
      };
      img.onerror = () => {
        callback(e.target.result);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function applyAutoLockVote(sessions) {

      const [y, m, d] = parts;
      const cutoffDate = new Date(y, m - 1, d);
      
      // Lùi ngày theo cấu hình
      const daysBefore = parseInt(lockVoteCfg.days) || 1;
      cutoffDate.setDate(cutoffDate.getDate() - daysBefore);
      
      // Lấy giờ phút từ cấu hình
      const [timeH, timeM] = (lockVoteCfg.time || '10:00').split(':');
      cutoffDate.setHours(timeH, timeM, 0, 0);

      const cY = cutoffDate.getFullYear();
      const cM = String(cutoffDate.getMonth() + 1).padStart(2, '0');
      const cD = String(cutoffDate.getDate()).padStart(2, '0');
      const cutoffTimeStr = `${cY}-${cM}-${cD}T${String(timeH).padStart(2, '0')}:${String(timeM).padStart(2, '0')}:00`;

      if (nowStamp >= cutoffTimeStr) {
        const mKey = sessionMonthKey(s);
        s.votes = s.votes || {};

    });

          for (const k in nM) {
            if (!(k in pM)) diffs.push(k);
          }

          if (diffs.length > 0) {
            // 3. Ngăn chặn thay đổi thông tin của Owner kietdmt
            if (isOwner(pM)) {
              console.error('Security block: regular admin attempted to modify Owner kietdmt.');
              return null;
            }

            // 4. Ngăn tự ý thay đổi quyền hạn/trạng thái của chính mình
            if (pM.id === currentUser.id) {
              if (diffs.includes('role') || diffs.includes('status')) {
                console.error('Security block: admin attempted self role/status modification.');
                return null;
              }
            }

            // 5. Ngăn chặn bổ nhiệm Admin/Owner mới
            if (pM.role !== 'admin' && nM.role === 'admin') {
              console.error('Security block: regular admin attempted to appoint a new Admin.');
              return null;
            }
            if (nM.role === 'owner') {
              console.error('Security block: regular admin attempted to appoint an Owner.');
              return null;
            }
          }
        }
        return next;
      }

      // Đối với R1 và R2, kiểm tra chi tiết các thay đổi để ngăn chặn leo thang quyền lực
      if (next.length > prev.length) {
        console.error('Security block: non-admin attempted to add members.');
        return null;
      }
      if (next.length < prev.length) {
        console.error('Security block: non-admin attempted to delete members.');
        return null;
      }

      for (let i = 0; i < prev.length; i++) {
        const pM = prev[i];
        const nM = next.find(x => x.id === pM.id);
        if (!nM) return null; // blocked (delete operation detected)

        // So sánh các thay đổi
        const diffs = [];
        for (const k in pM) {
          if (JSON.stringify(pM[k]) !== JSON.stringify(nM[k])) diffs.push(k);
        }
        for (const k in nM) {
          if (!(k in pM)) diffs.push(k);
        }

        if (diffs.length > 0) {
          if (pM.id !== currentUser.id) {
            // Đang chỉnh sửa tài khoản của người khác
            const isTargetAdminOrOwner = pM.role === 'admin' || isOwner(pM);
            if (currentRole === 'r1') {
              if (isTargetAdminOrOwner) {
                // Đối với Admin/Owner, R1 chỉ được phép sửa duy nhất trường đăng ký tháng (monthlyType)
                const unauthorizedDiffs = diffs.filter(k => k !== 'monthlyType');
                if (unauthorizedDiffs.length > 0) {
                  console.error('Security block: R1 attempted to modify administrative fields on Admin/Owner.', unauthorizedDiffs);
                  return null;
                }
              } else {
                // Đối với thành viên thường (R2/R1 khác), R1 được phép sửa đổi thông tin/mật khẩu, nhưng cấm sửa vai trò (role) và trạng thái (status)
                const forbiddenKeysForR1 = ['role', 'status'];
                const violations = diffs.filter(k => forbiddenKeysForR1.includes(k));
                if (violations.length > 0) {
                  console.error('Security block: R1 attempted unauthorized modification of role/status on other member.', violations);
                  return null;
                }
              }
            } else {
              // R2 cấm sửa bất kỳ tài khoản nào khác
              console.error('Security block: R2 attempted to modify other member.');
              return null;
            }
          } else {
            // Đang chỉnh sửa tài khoản của chính mình
            // Thành viên thường (R1/R2) cấm tự ý thay đổi: vai trò (role), trạng thái (status), mã định danh (id)
            const forbiddenKeys = ['role', 'status', 'id'];
            const violations = diffs.filter(k => forbiddenKeys.includes(k));
            if (violations.length > 0) {
              console.error('Security block: member attempted unauthorized self-modification.', violations);
              return null;
            }
          }
        }
      }

      return next;
    }, []);
    if (updated === null) return false;
    state.members = updated;
    resolveMe();
    return true;
  }

  function memberType(name, mKey){
    const m = state.members.find(x => x.name === name);
    if (!m || !m.monthlyType) return 'casual';
    return m.monthlyType[mKey] || 'casual';
  }

  function computeShares(s){
    const mKey = sessionMonthKey(s);
    const activeMembers = state.members.filter(m => {
      const curType = (m.monthlyType || {})[mKey] || '';
      return curType === 'fixed' || curType === 'casual';
    });
    const activeNames = activeMembers.map(m => m.name);
    const yesNames = Object.entries(s.votes)
      .filter(([,v]) => v === 'yes')
      .map(([name]) => name)
      .filter(name => activeNames.includes(name));
    let fixedNames = state.members.filter(m => (m.monthlyType || {})[mKey] === 'fixed' && m.status === 'active').map(m => m.name);
    let casualNames = yesNames.filter(n => memberType(n, mKey) !== 'fixed');

    // Pass slot: cố định đã pass vẫn trả phí; vãng lai nhận pass MIỄN PHÍ
    const passes = s.passes || {};
    const freeNames = [];
    Object.entries(passes).forEach(([fixedMemberId, casualMemberId]) => {
      if (!casualMemberId) return;
      const fixedMember = state.members.find(x => x.id === fixedMemberId);
      const casualMember = state.members.find(x => x.id === casualMemberId);
      if (fixedMember && !fixedNames.includes(fixedMember.name)) fixedNames.push(fixedMember.name);
      if (casualMember) {
        casualNames = casualNames.filter(n => n !== casualMember.name);
        if (!freeNames.includes(casualMember.name)) freeNames.push(casualMember.name);
      }
    });

    // --- Chế độ áp mức cố định (flat rate) ---
    const fr = s.flatRate || {};
    if (fr.enabled) {
      const fixedShare = fr.fixed || 0;
      const casualShare = fr.casual || 0;
      const total = fixedNames.length * fixedShare + casualNames.length * casualShare;
      return {
        mode: 'flat',
        total, fixedNames, casualNames, freeNames,
        fixedShare, casualShare, multiplier: fixedShare > 0 ? (casualShare / fixedShare) : null,
        passedFromNames: Object.keys(passes).map(fid => state.members.find(x => x.id === fid)?.name).filter(Boolean),
        passedToNames: freeNames
      };
    }

    // --- Chế độ chia chi phí (mặc định) ---
    const costs = s.costs || { court: 0, water: 0, shuttle: 0, other: 0 };
    const total = (costs.court||0) + (costs.water||0) + (costs.shuttle||0) + (costs.other||0);
    const m = state.settings.casualMultiplier || 1.5;
    const denom = fixedNames.length + m * casualNames.length;
    const unit = denom > 0 ? total / denom : 0;
    return {
      mode: 'split',
      total, fixedNames, casualNames, freeNames,
      fixedShare: unit, casualShare: unit * m, multiplier: m,
      passedFromNames: Object.keys(passes).map(fid => state.members.find(x => x.id === fid)?.name).filter(Boolean),
      passedToNames: freeNames
    };
  }

  // ---------- Tiện ích dữ liệu cho Trang chủ / Lịch ----------
  function localNowStamp(){
    const d = new Date(); const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function sessionStartStamp(s){ return (s.date || '') + (s.time || '00:00'); }
  function sessionEndStamp(s){ return (s.date || '') + (s.timeEnd || s.time || '23:59'); }
  function isUpcomingSession(s){ return sessionEndStamp(s) >= localNowStamp(); }

  function sessionCounts(s){
    const mKey = sessionMonthKey(s); const passes = s.passes || {}; const votes = s.votes || {};
    const yes = [], no = [];
    let fixedPlaying = 0, casualPlaying = 0, totalFixed = 0, totalCasual = 0;
    state.members.forEach(m => {
      if (m.status !== 'active') return;
      const t = (m.monthlyType || {})[mKey] || '';
      const v = votes[m.name];
      const hasPassed = t === 'fixed' && passes[m.id];
      const isReceiver = Object.values(passes).includes(m.id);
      if (t === 'fixed') {
        totalFixed++;
        if (v === 'yes' && !hasPassed) { fixedPlaying++; yes.push(m); }
        else if (hasPassed || v === 'no') no.push(m);
      } else if (t === 'casual') {
        totalCasual++;
        if (v === 'yes' || isReceiver) { casualPlaying++; yes.push(m); }
        else if (v === 'no') no.push(m);
      }
    });
    return { yes, no, fixedPlaying, casualPlaying, totalFixed, totalCasual, waiting: Math.max(0, totalFixed + totalCasual - yes.length - no.length) };
  }

  function mySessionState(s){
    const me = state.me;
    const mKey = sessionMonthKey(s);
    const type = (me.monthlyType || {})[mKey] || '';
    const vote = (s.votes || {})[me.name];
    const passes = s.passes || {};
    const hasPassed = type === 'fixed' && !!passes[me.id];
    const isReceiver = Object.values(passes).includes(me.id);
    const counts = sessionCounts(s);
    let can = true, reason = '', needReg = false;
    if (me.status !== 'active') { can = false; reason = 'Tài khoản của bạn đang ngưng hoạt động, liên hệ Admin để vote lại.'; }
    else if (s.locked && role() === 'r2') { can = false; reason = '🔒 Buổi đã được chốt, không thể đổi vote. Liên hệ Admin/R1 nếu cần sửa.'; }
    else if (type !== 'fixed' && type !== 'casual') { can = false; needReg = true; reason = 'Bạn chưa đăng ký hoạt động ' + monthLabel(mKey) + ' (Cố định/Vãng lai) nên chưa thể vote.'; }
    else if (hasPassed) { can = false; reason = 'Bạn đã nhường slot buổi này (tính là vắng). Mở chi tiết để huỷ nhường.'; }
    else if (isReceiver) { can = false; reason = 'Bạn đã nhận pass và sẽ tham gia buổi này.'; }
    const casualFull = type === 'casual' && vote !== 'yes' && !!s.maxCasual && counts.casualPlaying >= s.maxCasual;
    let label, tone;
    if (hasPassed) { label = 'Đã nhường slot'; tone = 'warn'; }
    else if (isReceiver) { label = 'Nhận pass'; tone = 'info'; }
    else if (vote === 'yes') { label = 'Bạn tham gia'; tone = 'ok'; }
    else if (vote === 'no') { label = 'Bạn vắng'; tone = 'bad'; }
    else { label = 'Chưa vote'; tone = 'gold'; }
    return { type, vote, hasPassed, isReceiver, can, reason, casualFull, label, tone, counts, needReg, regMonth: mKey };
  }
  function castVote(s, v){
    s.votes = s.votes || {};
    s.votes[state.me.name] = v;
    saveSessions(); render();
  }
  function voteButtons(s, st, cls){
    const wrap = el(`<div class="${cls}"></div>`);
    if (!st.can) {
      const note = el(`<div class="a-note ${st.vote ? '' : 'warn'}">${escapeHtml(st.reason)}</div>`);
      if (st.needReg) {
        if (isMonthLocked(st.regMonth)) note.appendChild(el(`<div style="margin-top:6px;">Đăng ký ${monthLabel(st.regMonth)} đã chốt — liên hệ Admin/R1.</div>`));
        else { const rb = el(`<button class="a-btn sm" style="margin-top:10px;">Đăng ký ${monthLabel(st.regMonth)}</button>`); rb.onclick = () => openRegisterSheet(st.regMonth); note.appendChild(rb); }
      }
      wrap.appendChild(note); return wrap;
    }
    const yes = el(`<button class="a-btn ${st.vote === 'yes' ? 'ok' : 'off'}" data-v="yes">${icon('check', 20)}${st.casualFull ? 'Hết chỗ vãng lai' : 'Tham gia'}</button>`);
    const no = el(`<button class="a-btn ${st.vote === 'no' ? 'bad' : 'off'}" data-v="no">${icon('x', 20)}Vắng</button>`);
    if (st.casualFull) { yes.disabled = true; } else { yes.onclick = () => castVote(s, 'yes'); }
    no.onclick = () => castVote(s, 'no');
    wrap.appendChild(yes); wrap.appendChild(no);
    return wrap;
  }
  function relDayLabel(dateStr){
    const d = new Date(dateStr + 'T00:00:00'); if (isNaN(d)) return '';
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const diff = Math.round((d - t) / 86400000);
    if (diff === 0) return 'Hôm nay';
    if (diff === 1) return 'Ngày mai';
    if (diff > 1 && diff < 7) return 'Còn ' + diff + ' ngày';
    return weekdayLabel(dateStr);
  }
  function dateTile(s, cls){
    const d = new Date(s.date + 'T00:00:00');
    return `<div class="a-date ${cls || ''}"><b>${isNaN(d) ? '--' : String(d.getDate()).padStart(2, '0')}</b><span>Th ${isNaN(d) ? '' : d.getMonth() + 1}</span></div>`;
  }

  // ---------- TRANG CHỦ theo vai trò ----------
  function renderHome(){
    const me = state.me;
    const wrap = el(`<div class="a-home"></div>`);
    const mgr = canManage();

    // 1. Thẻ chào
    const xp = calculateMemberXP(me.id, state.sessions);
    const rk = getXPRank(xp);
    const ri = XP_RANKS.findIndex(r => r.key === rk.key);
    const nx = XP_RANKS[ri + 1];
    const pct = nx ? Math.max(5, Math.min(100, Math.round((xp - rk.min) / (nx.min - rk.min) * 100))) : 100;
    const hr = new Date().getHours();
    const greet = hr < 11 ? 'Chào buổi sáng' : hr < 18 ? 'Chào buổi chiều' : 'Chào buổi tối';
    const first = me.nickname || (me.name || '').trim().split(/\s+/).slice(-1)[0];
    wrap.appendChild(el(`<section class="a-hero art sheen">
      <div class="a-hero-art" aria-hidden="true"></div>
      <div class="a-greet">${greet},</div>
      <div class="a-name">${escapeHtml(first)} 👋</div>
      <div class="a-chips"><span class="a-chip">${ROLE_LABEL[me.role] || me.role}</span><span class="a-chip gold">${rk.emoji} ${rk.label}</span></div>
      <div class="a-xp"><div class="a-xp-bar"><i style="width:${pct}%"></i></div>
        <div class="a-xp-t"><span>${xp} XP</span><span>${nx ? 'Còn ' + Math.max(0, nx.min - xp) + ' XP lên ' + nx.emoji + ' ' + nx.label : 'Cấp cao nhất'}</span></div></div>
    </section>`));

    // 1b. Nhắc đăng ký hoạt động tháng (nếu chưa đăng ký và chưa chốt)
    {
      const upsForReg = state.sessions.filter(isUpcomingSession).sort((a, b) => sessionStartStamp(a).localeCompare(sessionStartStamp(b)));
      const regMonth = upsForReg.length ? sessionMonthKey(upsForReg[0]) : monthKey();
      if (me.status === 'active' && !((me.monthlyType || {})[regMonth]) && !isMonthLocked(regMonth)) {
        const rc = el(`<section class="a-card" style="border-left:5px solid var(--a-gold);"><div class="a-kicker">Đăng ký ${monthLabel(regMonth)}</div>
          <div class="a-h2" style="margin-top:6px; font-size:16px;">Bạn chưa đăng ký hoạt động tháng này</div>
          <div class="a-sub" style="margin:4px 0 12px; line-height:1.5;">Đăng ký để được vote các buổi đánh trong tháng.</div>
          <div class="a-vote" style="margin-top:0;"><button class="a-btn" data-t="fixed">Cố định</button><button class="a-btn ghost" data-t="casual">Vãng lai</button></div>
          <button class="a-btn-link" id="home-reg-info" style="margin-top:8px;">Khác nhau thế nào?</button></section>`);
        rc.querySelectorAll('[data-t]').forEach(b => { b.onclick = () => setMonthType(me.id, regMonth, b.dataset.t); });
        rc.querySelector('#home-reg-info').onclick = () => openRegisterSheet(regMonth);
        wrap.appendChild(rc);
      }
    }

    // 2. Việc cần xử lý (Admin / R1)
    if (mgr) {
      const cfg = navConfig();
      const todo = el(`<section class="a-card"><div class="a-kicker">Cần xử lý</div></section>`);
      const addRow = (n, label, onGo) => {
        const r = el(`<button class="a-todo"><span class="a-coin ${n === 0 ? 'zero' : ''}">${n === 0 ? '✓' : n}</span><span>${label}</span>${icon('chev', 18)}</button>`);
        r.onclick = onGo; todo.appendChild(r);
      };
      addRow(cfg.pendingMembers, cfg.pendingMembers ? 'Thành viên chờ duyệt' : 'Không có thành viên chờ duyệt', () => { state.memberFilter = 'pending'; goTab('members'); });
      addRow(cfg.pendingPays, cfg.pendingPays ? 'Yêu cầu thanh toán chờ duyệt' : 'Không có thanh toán chờ duyệt', () => goTab('payments_mgr'));
      wrap.appendChild(todo);
    }

    // 3. Buổi tới + vote một chạm
    const ups = state.sessions.filter(isUpcomingSession).sort((a, b) => sessionStartStamp(a).localeCompare(sessionStartStamp(b)));
    if (ups.length === 0) {
      wrap.appendChild(el(`<section class="a-card"><div class="a-kicker">Buổi tới</div>
        <div class="a-h2" style="margin-top:8px;">Chưa có buổi đánh sắp tới</div>
        <div class="a-sub" style="margin-top:4px;">${mgr ? 'Tạo buổi mới để mọi người bắt đầu vote.' : 'Khi có lịch mới, bạn sẽ thấy ở đây.'}</div>
        ${mgr ? `<button class="a-btn sm" id="home-newsess" style="margin-top:12px;">${icon('plus', 18)}Tạo buổi đánh</button>` : ''}</section>`));
      const nb = wrap.querySelector('#home-newsess');
      if (nb) nb.onclick = () => { state.showSessionForm = true; goTab('sessions'); };
    } else {
      const s = ups[0];
      const st = mySessionState(s);
      const court = state.courts.find(c => c.id === s.courtId);
      const c = st.counts;
      const card = el(`<section class="a-card a-next">
        <div class="a-kicker">Buổi tới · ${relDayLabel(s.date)}</div>
        <div class="a-next-top">${dateTile(s, 'hot')}
          <div><div class="a-next-t">${weekdayLabel(s.date)} · ${formatTimeRange(s.time || '', s.timeEnd || '')}</div>
          <div class="a-next-s">📍 ${court ? escapeHtml(court.name) : 'Chưa chọn sân'}</div></div></div>
        <div class="a-chips"><span class="a-chip ok">${c.yes.length} tham gia</span><span class="a-chip bad">${c.no.length} vắng</span>${c.waiting ? `<span class="a-chip gold">${c.waiting} chưa vote</span>` : ''}${s.locked ? '<span class="a-chip warn">🔒 Đã chốt</span>' : ''}</div>
        <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:10px;">${avatarStack(c.yes, 6)}<button class="a-btn-link" id="home-detail">Chi tiết ›</button></div>
      </section>`);
      card.appendChild(voteButtons(s, st, 'a-vote'));
      if (s.note) card.appendChild(el(`<div class="a-note">📝 ${escapeHtml(s.note)}</div>`));
      card.querySelector('#home-detail').onclick = () => { state.openSessionId = s.id; state.sessionsView = 'upcoming'; goTab('sessions'); };
      wrap.appendChild(card);

      if (ups.length > 1) {
        const more = el(`<section class="a-card"><div class="a-kicker">Các buổi tiếp theo</div></section>`);
        ups.slice(1, 3).forEach(x => {
          const sx = mySessionState(x);
          const r = el(`<button class="a-todo" style="margin-top:10px;">${dateTile(x, 'sm')}<span><b>${weekdayLabel(x.date)} · ${formatTimeRange(x.time || '', x.timeEnd || '')}</b><br><span style="font-weight:500;color:var(--a-ink-3);font-size:12.5px;">${sx.counts.yes.length} tham gia</span></span><span class="a-chip ${sx.tone}">${sx.label}</span></button>`);
          r.onclick = () => { state.openSessionId = x.id; state.sessionsView = 'upcoming'; goTab('sessions'); };
          more.appendChild(r);
        });
        wrap.appendChild(more);
      }
    }

    // 4. Tiền phải đóng
    const month = monthKey();
    const sum = computeMemberMonthSummary(month)[me.id] || { count: 0, owed: 0 };
    const pay = ((state.payments || {})[me.id] || {})[month] || { paid: 0, prepaid: 0 };
    let prev = 0;
    try { prev = (computeAllMembersPreviousDebt(month) || {})[me.id] || 0; } catch (e) { prev = 0; }
    const thisMonthLeft = Math.round(sum.owed - (pay.paid || 0) - (pay.prepaid || 0));
    const total = Math.round(prev + thisMonthLeft);
    const payCard = el(`<section class="a-card"><div class="a-kicker">Quỹ · Tháng ${monthLabel(month).replace(/^Th/, '')}</div>
      <div class="a-money ${total > 0 ? 'due' : 'ok'}">${total > 0 ? formatVND(total) : 'Đã hoàn tất ✓'}</div>
      <div class="a-sub" style="margin-bottom:10px;">${total > 0 ? 'Số tiền bạn còn cần đóng' : (total < 0 ? 'Bạn đang dư ' + formatVND(-total) : 'Bạn không còn khoản nào phải đóng')}</div>
      <div class="a-lines"><div><span>Tháng này (${sum.count} buổi)</span><b>${formatVND(Math.round(sum.owed))}</b></div>
        ${(pay.paid || pay.prepaid) ? `<div><span>Đã nộp</span><b>${formatVND(Math.round((pay.paid || 0) + (pay.prepaid || 0)))}</b></div>` : ''}
        ${prev > 0 ? `<div><span>Nợ kỳ trước</span><b style="color:var(--a-bad)">${formatVND(Math.round(prev))}</b></div>` : ''}</div>
      <div style="display:flex; gap:10px;">${total > 0 ? `<button class="a-btn" id="home-pay" style="flex:1;">Nộp qua QR</button>` : ''}<button class="a-btn ghost" id="home-fund" style="${total > 0 ? '' : 'flex:1;'}">Chi tiết quỹ</button></div></section>`);
    const pb = payCard.querySelector('#home-pay');
    if (pb) pb.onclick = () => { state.viewMonth = month; state.autoOpenPaymentQr = true; goTab('fund'); };
    payCard.querySelector('#home-fund').onclick = () => { state.viewMonth = month; goTab('fund'); };
    wrap.appendChild(payCard);

    // 5. Bảng tin
    const todayStr = new Date().toLocaleDateString('sv-SE');
    const news = (state.announcements || []).filter(a => !(a.expireDate && a.expireDate < todayStr))
      .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 3);
    if (news.length) {
      const ICO = { general: '📢', alert: '🚨', match: '🔥', party: '🎉', tournament: '🏆' };
      const nc = el(`<section class="a-card"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="a-kicker">Bảng tin</div><button class="a-btn-link" id="home-news-all">Xem tất cả ›</button></div></section>`);
      news.forEach(a => {
        const r = el(`<div class="a-news"><div class="a-news-ic">${a.pinned ? '📌' : (ICO[a.category] || '📢')}</div><div style="min-width:0;"><div class="a-news-t">${escapeHtml(a.title || '')}</div><div class="a-news-c">${escapeHtml((a.content || '').replace(/\*\*/g, ''))}</div></div></div>`);
        r.onclick = () => { state.annOpen = true; goTab('sessions'); };
        nc.appendChild(r);
      });
      nc.querySelector('#home-news-all').onclick = () => { state.annOpen = true; goTab('sessions'); };
      wrap.appendChild(nc);
    }
    return wrap;
  }

  // ---------- Dòng buổi đánh gọn (Lịch đánh) ----------
  function renderSessionRow(s){
    const court = state.courts.find(c => c.id === s.courtId);
    const open = state.openSessionId === s.id;
    const up = isUpcomingSession(s);
    const cnt = sessionCounts(s);
    const st = state.me ? mySessionState(s) : null;
    const row = el(`<div class="a-srow ${open ? 'open' : ''}">
      <div class="a-srow-main">${dateTile(s, up ? '' : 'dim')}
        <div class="a-srow-i"><div class="a-srow-t">${weekdayLabel(s.date)} · ${formatTimeRange(s.time || '', s.timeEnd || '')}</div>
          <div class="a-srow-s">📍 ${court ? escapeHtml(court.name) : 'Chưa chọn sân'}</div>
          <div class="a-chips"><span class="a-chip ok">${cnt.yes.length} tham gia</span>${s.locked ? '<span class="a-chip warn">🔒 Đã chốt</span>' : ''}${st ? `<span class="a-chip ${st.tone}">${st.label}</span>` : ''}</div></div>
        <span class="a-chev">${icon('chev', 20)}</span></div>
    </div>`);
    row.querySelector('.a-srow-main').onclick = () => { state.openSessionId = open ? null : s.id; render(); };
    if (up && st && !open) {
      if (st.can) { const vb = voteButtons(s, st, 'a-srow-vote'); row.appendChild(vb); }
    }
    if (open) {
      const det = el(`<div class="a-srow-detail"></div>`);
      if (up && st && st.can) {
        const vb = voteButtons(s, st, 'a-vote');
        vb.style.padding = '12px 6px 4px';
        det.appendChild(vb);
      }
      const card = renderSessionCard(s);
      det.appendChild(card);
      if (up && st && st.can) { const oldRow = card.querySelector('#vote-' + s.id); if (oldRow) oldRow.style.display = 'none'; }
      row.appendChild(det);
    }
    return row;
  }

  //  ARON UI · đợt 2 — Hồ sơ, Thành viên, Quỹ
